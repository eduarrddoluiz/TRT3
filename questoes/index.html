.chips{display:flex;flex-wrap:wrap;gap:6px}.chip{font-size:12px;font-weight:600;padding:3px 9px;border-radius:99px;border:1px solid var(--line);color:var(--mut);background:var(--card)}.chip.on{border-color:var(--ok);color:var(--ok)}

<div class="wrap" id="app"><div class="empty">Carregando…</div></div>
<nav id="nav"></nav><div id="sh"></div><div id="ov"></div><div id="toast"></div>
<script>
'use strict';
/* ===== constantes ===== */
const DAY=864e5;
const MAT={PT:'Língua Portuguesa',INF:'Noções de Informática',CON:'Noções de Direito Constitucional',ADM:'Noções de Direito Administrativo',LEG:'Legislação',DT:'Noções de Direito do Trabalho',DPT:'Noções de Direito Processual do Trabalho'};
const MATS=Object.values(MAT);
const MABR={[MAT.PT]:'Português',[MAT.INF]:'Informática',[MAT.CON]:'Constitucional',[MAT.ADM]:'Administrativo',[MAT.LEG]:'Legislação',[MAT.DT]:'D. Trabalho',[MAT.DPT]:'P. Trabalho'};
const ROT={1:[MAT.DT,MAT.PT],2:[MAT.DPT,MAT.ADM],3:[MAT.DT,MAT.CON],4:[MAT.DPT,MAT.LEG],5:[MAT.PT,MAT.INF],6:[MAT.ADM,MAT.CON]};
const DIAS=['Domingo','Segunda','Terça','Quarta','Quinta','Sexta','Sábado'];
const NIV={1:'Básico',2:'Intermediário',3:'Avançado'};
const LET='ABCDE';
const LADS={eq:[3,7,15,30,60,120],fr:[2,4,8,15,30,60],es:[4,10,25,60,120,240]};
const CFG0={meta:30,novasMin:8,maxRev:50,lad:LADS.eq,emb:true,push:true,flash:false,niv:{}};
const keyOf=(m,a,s)=>((m||'')+'|'+(a||'')+'|'+(s||'')).toLowerCase().replace(/\s+/g,' ').trim();
const KEY='trt3_questoes_v1',SHK='trt3_tecnico_db_v1';

/* ===== utilidades ===== */
const $=s=>document.querySelector(s);
const esc=s=>String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const fmt=s=>esc(s).replace(/\*\*(.+?)\*\*/g,'<b>$1</b>').replace(/__(.+?)__/g,'<u>$1</u>');
function todayNum(){const t=new Date();return Math.floor(Date.UTC(t.getFullYear(),t.getMonth(),t.getDate())/DAY)}
function iso(n){const d=new Date(n*DAY);return d.getUTCFullYear()+'-'+String(d.getUTCMonth()+1).padStart(2,'0')+'-'+String(d.getUTCDate()).padStart(2,'0')}
function dn(s){if(!s)return null;const p=String(s).split('-');return Math.floor(Date.UTC(+p[0],+p[1]-1,+p[2])/DAY)}
const fd=n=>{const d=new Date(n*DAY);return String(d.getUTCDate()).padStart(2,'0')+'/'+String(d.getUTCMonth()+1).padStart(2,'0')};
const pct=(a,b)=>b>0?Math.round(a/b*100)+'%':'—';
const diasTxt=n=>n===1?'1 dia':n+' dias';
function toast(t){const e=$('#toast');e.innerHTML=`<div class="toast">${esc(t)}</div>`;clearTimeout(toast.t);toast.t=setTimeout(()=>e.innerHTML='',2600)}
function norm(s){return String(s||'').toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,'')}
function hash(s){let h=5381;for(let i=0;i<s.length;i++)h=((h<<5)+h+s.charCodeAt(i))|0;return (h>>>0).toString(36)}
function shuf(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}

/* ===== armazenamento próprio ===== */
function def(){return {v:1,est:{},hist:[],imp:[],cfg:{},lib:[],nota:{},flag:{},nv:{}}}
let D=load();
function load(){try{const o=JSON.parse(localStorage.getItem(KEY)||'null');if(o&&o.est)return Object.assign(def(),o)}catch(e){}return def()}
function save(){try{localStorage.setItem(KEY,JSON.stringify(D));return true}catch(e){toast('Sem espaço no navegador. Baixe um backup em Mais.');return false}}
const cfg=()=>Object.assign({},CFG0,D.cfg);

/* ===== banco compartilhado com o app de estudo (somente leitura, exceto sessões e fechamento) ===== */
function shRead(){try{const o=JSON.parse(localStorage.getItem(SHK)||'null');return o&&o.docs?o:null}catch(e){return null}}
function shWrite(path,data){try{const o=shRead();if(!o||!o.docs['app/assuntos'])return false;o.docs[path]=data;localStorage.setItem(SHK,JSON.stringify(o));return true}catch(e){return false}}
let ED=[],EDFALL=[],TOP=new Map(),ORD=new Map(),TW=new Map(),SK=new Set();
function loadEdital(){const o=shRead(),it=o&&o.docs['app/assuntos']&&o.docs['app/assuntos'].items;S.estudo=!!(it&&it.length);ED=S.estudo?it:EDFALL;
  TOP=new Map(ED.map(i=>[i.id,i]));ORD=new Map(ED.map((i,k)=>[i.id,k]));TW=new Map();SK=new Set();
  for(const i of ED)if(i.dupId&&TOP.has(i.dupId)){for(const [a,b] of [[i.id,i.dupId],[i.dupId,i.id]]){if(!TW.has(a))TW.set(a,new Set());TW.get(a).add(b)}}
  if(o)for(const k in o.docs)if(k.startsWith('sessoes/')){const s=o.docs[k];if(s)SK.add(keyOf(s.m,s.a,s.s))}}
/* "estudado" segue a mesma regra do app de estudo: marcado, com checklist, com data de estudo ou com sessão registrada */
function studied(id){const i=TOP.get(id);if(!i)return false;const ck=i.ck||[];return i.st==='est'||i.st==='conc'||!!i.d0||ck.some(Boolean)||SK.has(keyOf(i.m,i.a,i.s))}
function viaStudy(id){if(studied(id))return true;for(const t of (TW.get(id)||[]))if(studied(t))return true;return false}
function unlocked(id){if(!id)return true;if(D.lib.includes(id)||viaStudy(id))return true;for(const t of (TW.get(id)||[]))if(D.lib.includes(t))return true;return false}
function provaDay(){const o=shRead(),p=o&&o.docs['app/horas']&&o.docs['app/horas'].prova;return p?dn(p):null}

/* ===== banco de questões ===== */
let SEEDQ=[],BANK=[],QM=new Map();
function setBank(){BANK=[];const seen=new Set();
  for(const q of SEEDQ.concat(D.imp)){if(!q||!q.id||seen.has(q.id)||!Array.isArray(q.a))continue;seen.add(q.id);
    const t=q.t&&TOP.get(q.t);q.m=t?t.m:(q.m||'Outras');q.as=t?t.a:(q.as||'');q.ss=t?t.s:(q.ss||'');BANK.push(q)}
  QM=new Map(BANK.map(q=>[q.id,q]));lvC.clear()}
async function loadBank(){const out=[];
  try{const ix=await fetch('bancos/index.json',{cache:'no-store'}).then(r=>r.json());
    for(const f of ix.arquivos){try{out.push(...await fetch('bancos/'+f,{cache:'no-store'}).then(r=>r.json()))}catch(e){}}}catch(e){}
  SEEDQ=out;setBank()}
const msOf=q=>{const s=[q.m];for(const t of (TW.get(q.t)||[])){const i=TOP.get(t);if(i&&!s.includes(i.m))s.push(i.m)}return s};
const qOpen=q=>!!D.est[q.id]||unlocked(q.t);

/* ===== motor de revisão (acerto afasta, erro aproxima; sem botões de dificuldade) ===== */
const lad=()=>cfg().lad;
/* taxa de acerto recente: do assunto (últimas 12 respostas, mínimo 8) ou, na falta, da disciplina (últimas 25, mínimo 15) */
function accOf(pred,max,min){let n=0,k=0;for(let i=D.hist.length-1;i>=0&&n<max;i--){const x=QM.get(D.hist[i].q);if(x&&pred(x)){n++;k+=D.hist[i].ok}}return n>=min?k/n:null}
function mult(q){let a=q.t?accOf(x=>x.t===q.t,12,8):null;if(a==null)a=accOf(x=>x.m===q.m,25,15);if(a==null)return 1;return a>=.9?1.4:a>=.8?1.2:a>=.6?1:.75}
function capProva(d,t){const p=provaDay();if(!p||p<=t)return d;return Math.max(1,Math.min(d,p-t-2))}
function applyAnswer(q,ok,ms){
  const t=todayNum();let s=D.est[q.id];const novo=!s;
  if(!s)s=D.est[q.id]={k:0,d:t,l:t,r:0,w:0,lp:0,f:t,s:null};
  const venc=novo||s.d<=t;
  s.l=t;s.s=ok?1:0;
  if(ok){s.r++;if(venc){s.k++;const L=lad(),base=L[Math.min(s.k-1,L.length-1)];s.d=t+capProva(Math.max(2,Math.round(base*mult(q))),t)}}
  else{s.w++;s.lp++;s.k=0;s.d=t+1}
  D.hist.push({q:q.id,t:Date.now(),d:t,ok:ok?1:0,ms:Math.min(ms,600000)});
  return {venc,s:{...s}}}
/* nível automático por matéria: libera o seguinte com 70% de acerto em 15 respostas, ou quando acabam as questões novas do nível */
const lvC=new Map();
function lvlStats(m,L){let n=0,k=0;for(const h of D.hist){const q=QM.get(h.q);if(q&&q.m===m&&q.n===L){n++;k+=h.ok}}return{n,p:n?k/n:0}}
function unseenAt(m,L){return BANK.some(q=>q.m===m&&q.n===L&&!D.est[q.id]&&unlocked(q.t))}
function allowedLvl(m){if(lvC.has(m))return lvC.get(m);const c=(cfg().niv||{})[m]||'auto';let L;
  if(c==='todos')L=3;else if(c==='1'||c==='2')L=+c;
  else{L=1;while(L<3){const s=lvlStats(m,L),up=BANK.some(q=>q.m===m&&q.n>L&&!D.est[q.id]&&unlocked(q.t));if(up&&((s.n>=15&&s.p>=.7)||!unseenAt(m,L)))L++;else break}L=Math.max(L,D.nv[m]||1)}
  lvC.set(m,L);return L}
function ratchet(q){lvC.delete(q.m);const L=allowedLvl(q.m);if(L>(D.nv[q.m]||1))D.nv[q.m]=L}

/* ===== montagem da fila ===== */
const newPool=ms=>BANK.filter(q=>!D.est[q.id]&&qOpen(q)&&q.n<=allowedLvl(q.m)&&(!ms||ms.some(m=>msOf(q).includes(m))));
function pickNew(pool,need,ms){const by=new Map();
  for(const q of pool){const k=(ms&&ms.find(m=>msOf(q).includes(m)))||q.m;if(!by.has(k))by.set(k,[]);by.get(k).push(q)}
  for(const l of by.values())l.sort((a,b)=>(ORD.has(a.t)?ORD.get(a.t):9999)-(ORD.has(b.t)?ORD.get(b.t):9999)||a.n-b.n||a.id.localeCompare(b.id));
  const L=[...by.values()],out=[];let i=0;while(out.length<need&&L.some(l=>l.length)){const l=L[i%L.length];if(l.length)out.push(l.shift());i++}return out}
function answeredToday(){const t=todayNum();let n=0,k=0;for(let i=D.hist.length-1;i>=0;i--){const h=D.hist[i];if(h.d<t)break;if(h.d===t){n++;k+=h.ok}}return{n,k}}
function newToday(){const t=todayNum();return Object.values(D.est).filter(s=>s.f===t).length}
function morePool(ms,need,skip){let l=pickNew(newPool(ms),need,ms);
  if(l.length<need){const ids=new Set(l.map(q=>q.id).concat(skip||[]));l=l.concat(pickNew(newPool(null).filter(q=>!ids.has(q.id)),need-l.length,null))}return l}
function buildDay(){const t=todayNum(),c=cfg(),dow=new Date(t*DAY).getUTCDay(),ms=ROT[dow]||null;
  const all=BANK.filter(q=>{const s=D.est[q.id];return s&&s.d<=t}).sort((a,b)=>{const A=D.est[a.id],B=D.est[b.id];return (A.k===0?0:1)-(B.k===0?0:1)||A.d-B.d||B.lp-A.lp});
  const due=all.slice(0,c.maxRev),at=answeredToday(),rem=Math.max(0,c.meta-at.n);
  const need=Math.max(0,c.novasMin-newToday(),rem-due.length);
  const novas=morePool(ms,need,due.map(q=>q.id));
  return{due,novas,dueMais:all.length-due.length,ms,at,rem}}

/* ===== sessões enviadas ao Painel do app de estudo ===== */
/* Uma sessão por dia e por tópico (qz_AAAA-MM-DD_tNNN). O contador vem do próprio documento do app de estudo,
   então edições ou exclusões feitas lá são respeitadas. Só envia para tópicos que o app de estudo já considera iniciados. */
function pushSes(q,ok){if(!cfg().push||!q.t||!TOP.has(q.t)||!viaStudy(q.t))return;
  const it=TOP.get(q.t),d=iso(todayNum()),path='sessoes/qz_'+d+'_'+q.t,o=shRead(),cur=(o&&o.docs[path])||{};
  if(shWrite(path,{tipo:'Questões',motivo:'',obs:'App de questões',n:900,...cur,auto:1,d,m:it.m,a:it.a,s:it.s,q:(+cur.q||0)+1,ac:(+cur.ac||0)+(ok?1:0)}))SK.add(keyOf(it.m,it.a,it.s))}
function marcaFechamento(){if(cfg().flash&&shWrite('flash/'+iso(todayNum()),{ok:true}))toast('Fechamento do dia marcado no app de estudo')}

/* ===== sessão de resolução (tela estilo QConcursos) ===== */
const S={tab:'hoje',run:null,sheet:null,estudo:false,ready:false,tf:{m:'',t:'',n:'',st:'nr',orig:'',qtd:20,todos:false},bq:'',bn:30,pi:null,libAll:false};
function mkPerm(q){const n=q.a.length,id=[...Array(n).keys()];return(cfg().emb&&!q.fx&&!q.imp)?shuf(id):id}
function startRun(ids,modo){if(!ids.length)return toast('Não há questões para esta sessão.');
  S.run={q:ids,i:0,modo,res:[],pick:null,ans:null,cut:new Set(),perm:mkPerm(QM.get(ids[0])),t0:Date.now(),fim:false};renderSolve()}
function startDay(){const P=buildDay();startRun(P.due.concat(P.novas).map(q=>q.id),'dia')}
function startExtra(n){const t=todayNum(),ms=ROT[new Date(t*DAY).getUTCDay()]||null;const l=morePool(ms,n,[]);if(!l.length)return toast('Não há mais questões novas nos tópicos liberados.');startRun(l.map(q=>q.id),'extra')}
function pick(i){const R=S.run;if(!R||R.ans||R.cut.has(i))return;R.pick=i;renderSolve()}
function cutAlt(i){const R=S.run;if(!R||R.ans)return;if(R.cut.has(i))R.cut.delete(i);else{R.cut.add(i);if(R.pick===i)R.pick=null}renderSolve()}
function answer(){const R=S.run;if(!R||R.ans||R.pick==null)return;const q=QM.get(R.q[R.i]),ok=R.perm[R.pick]===q.g,ms=Date.now()-R.t0;
  let info=null;
  if(R.modo!=='refazer'){info=applyAnswer(q,ok,ms);ratchet(q);save();pushSes(q,ok)}
  R.ans={ok,ms,info,pick:R.pick};R.res.push({id:q.id,ok,ms});renderSolve();$('.solver').scrollTo({top:0})}
function nextQ(){const R=S.run;if(!R.ans)return;R.i++;if(R.i>=R.q.length){R.fim=true;if(R.modo==='dia'&&R.res.length>=R.q.length)marcaFechamento();renderSolve();return}
  R.pick=null;R.ans=null;R.cut=new Set();R.perm=mkPerm(QM.get(R.q[R.i]));R.t0=Date.now();renderSolve();$('.solver').scrollTo({top:0})}
function endRun(){const R=S.run;if(!R.res.length){closeRun();return}R.fim=true;renderSolve()}
function closeRun(){S.run=null;$('#ov').innerHTML='';render()}
function redo(){const w=S.run.res.filter(x=>!x.ok).map(x=>x.id);startRun(w,'refazer')}
function toggleFlag(id){if(D.flag[id])delete D.flag[id];else D.flag[id]={t:Date.now()};save();renderSolve()}
function saveNota(id,v){v=v.trim();if(v)D.nota[id]=v;else delete D.nota[id];save()}
const MODO={dia:'Sessão do dia',livre:'Treino livre',extra:'Questões extras',refazer:'Refazendo erradas'};
function qTxt(q,inv){return fmt(q.c||'').replace(/\{([A-E])\}/g,(m,x)=>{const p=inv[LET.indexOf(x)];return p==null?m:'<b>'+LET[p]+'</b>'})}
function qBlock(q,perm,R){ /* enunciado + alternativas; R = sessão (opcional) */
  const done=R&&R.ans,g=perm.indexOf(q.g);
  return `${q.x?`<div class="qtxt">${fmt(q.x)}</div>`:''}<div class="sim-enun">${fmt(q.e)}</div>
  <div class="sim-alts">${perm.map((o,p)=>{const cls=!R?(p===g?'gab ro':'ro'):done?('ro'+(p===g?' gab':(R.ans.pick===p?' err':''))):((R.pick===p?'on ':'')+(R.cut.has(p)?'cut':''));
   return `<div class="arow"><button class="sim-alt ${cls}" ${R&&!done?`onclick="pick(${p})"`:''} aria-label="Alternativa ${LET[p]}"><span class="sim-l">${LET[p]}</span><span class="tx">${fmt(q.a[o])}</span></button>${R&&!done?`<button class="scis ${R.cut.has(p)?'on':''}" onclick="cutAlt(${p})" aria-label="Riscar alternativa ${LET[p]}" title="Riscar alternativa">✂</button>`:''}</div>`}).join('')}</div>`}
function renderSolve(){const R=S.run,ov=$('#ov');if(!R){ov.innerHTML='';return}
  if(R.fim){ov.innerHTML=vFim();return}
  const q=QM.get(R.q[R.i]),t=todayNum(),est=D.est[q.id],inv=[];R.perm.forEach((o,p)=>inv[o]=p);
  const tag=R.ans?'':(!est?'Nova':est.d<=t?(est.d<t?'Revisão · venceu há '+diasTxt(t-est.d):'Revisão de hoje'):'Treino livre');
  let h=`<div class="solver"><div class="wrap"><div class="sim-bar"><div class="row sp"><div class="grow"><div class="tag">${MODO[R.modo]} · ${R.i+1} de ${R.q.length}</div><div class="bar" style="margin-top:6px"><i style="width:${(R.i+(R.ans?1:0))/R.q.length*100}%;background:var(--ok)"></i></div></div><button class="btn s" onclick="endRun()">Encerrar</button></div></div>
  <div class="chips" style="margin-top:6px"><span class="chip on">${esc(MABR[q.m]||q.m)}</span>${q.as?`<span class="chip">${esc(q.as)}${q.ss?' · '+esc(q.ss):''}</span>`:''}<span class="chip">${NIV[q.n]||''}</span>${tag?`<span class="chip">${esc(tag)}</span>`:''}${q.imp?'<span class="chip">importada</span>':''}</div>
  ${qBlock(q,R.perm,R)}`;
  if(!R.ans){h+=`<button class="btn p" style="width:100%;margin-top:16px" ${R.pick==null?'disabled':''} onclick="answer()">Responder</button><div class="sub" style="margin-top:8px;text-align:center">Teclas A a E escolhem, Enter responde. ✂ risca uma alternativa.</div>`}
  else{const A=R.ans,i=A.info,s=i&&i.s,gl=LET[R.perm.indexOf(q.g)];let msg='';
    if(R.modo==='refazer')msg='Treino de fixação: o calendário não muda.';
    else if(A.ok){if(i.venc){const n=s.d-t;msg=`Próxima revisão em ${diasTxt(n)} (${fd(s.d)}). Acertos seguidos: ${s.k}.`}else msg=`Acerto registrado. A revisão continua em ${fd(s.d)}, pois a questão ainda não tinha vencido.`}
    else msg=`Ela volta amanhã (${fd(s.d)}) e a sequência de acertos recomeça.`;
    h+=`<div class="fb ${A.ok?'ok':'er'}">${A.ok?'Você acertou! ✓':'Você errou. Gabarito: '+gl}<div class="sub">${esc(msg)}</div></div>
    <div class="sim-com"><b>Comentário</b>\n${qTxt(q,inv)}</div>
    ${q.b?`<div class="sub" style="margin-top:8px">${fmt(q.b)}</div>`:''}
    ${q.v===1?`<div class="sub" style="margin-top:6px;color:var(--ok)">✓ Texto legal conferido em fonte oficial.</div>`:q.v===0?`<div class="warn">⚠ Base legal escrita sem conferência no texto oficial nesta rodada. Confirme no texto da lei antes de decorar.</div>`:''}
    ${q.src?`<div class="sub" style="margin-top:6px">Fonte: ${esc(q.src)}</div>`:''}
    <label>Anotação sua (opcional)</label><textarea onchange="saveNota('${q.id}',this.value)" placeholder="Ex.: pegadinha, artigo para decorar…">${esc(D.nota[q.id]||'')}</textarea>
    <div class="row wr" style="margin-top:12px"><button class="btn s ${D.flag[q.id]?'d':''}" onclick="toggleFlag('${q.id}')">${D.flag[q.id]?'⚑ Problema marcado':'⚑ Marcar problema'}</button></div>
    <button class="btn p" style="width:100%;margin-top:14px" onclick="nextQ()">${R.i+1>=R.q.length?'Ver resultado':'Próxima →'}</button>`}
  h+=`</div></div>`;ov.innerHTML=h}
function vFim(){const R=S.run,n=R.res.length,k=R.res.filter(x=>x.ok).length,ms=R.res.reduce((s,x)=>s+x.ms,0),w=R.res.filter(x=>!x.ok),by={};
  R.res.forEach(x=>{const m=QM.get(x.id).m;(by[m]=by[m]||{n:0,k:0});by[m].n++;by[m].k+=x.ok});
  const cheio=R.modo==='dia'&&R.res.length>=R.q.length;
  return `<div class="solver"><div class="wrap"><h1>Resultado</h1><div class="sub">${MODO[R.modo]}</div>
  <div class="tiles" style="margin-top:12px"><div class="tile"><div class="l">Acertos</div><div class="n">${k}<span class="sub"> / ${n}</span></div></div><div class="tile"><div class="l">Aproveitamento</div><div class="n">${pct(k,n)}</div><div class="sub">${Math.round(ms/Math.max(1,n)/1000)} s por questão</div></div></div>
  ${cheio?`<div class="msg">Sessão do dia concluída.${cfg().flash&&S.estudo?' O fechamento do dia foi marcado no app de estudo.':''}</div>`:''}
  <h2>Por matéria</h2><div class="card">${Object.entries(by).map(([m,v])=>`<div class="row sp hist"><div>${esc(MABR[m]||m)}</div><div>${v.k}/${v.n} (${pct(v.k,v.n)})</div></div>`).join('')}</div>
  ${w.length?`<h2>Erradas (${w.length})</h2><div class="card">${w.map(x=>{const q=QM.get(x.id);return `<div class="hist"><b>${esc(q.id)}</b> · ${esc(q.as||MABR[q.m]||'')}<div class="sub">${esc(q.e.slice(0,110))}${q.e.length>110?'…':''}</div></div>`}).join('')}<div class="sub" style="margin-top:8px">Voltam amanhã na revisão. Antes disso, você pode refazer agora para fixar.</div></div>`:''}
  <div class="row wr" style="margin-top:14px">${w.length&&R.modo!=='refazer'?`<button class="btn g grow" onclick="redo()">Refazer as ${w.length} erradas</button>`:''}<button class="btn p grow" onclick="closeRun()">Concluir</button></div></div></div>`}
document.addEventListener('keydown',e=>{const R=S.run;if(!R||R.fim||/^(INPUT|TEXTAREA|SELECT)$/.test((document.activeElement||{}).tagName))return;
  const k=e.key.toLowerCase();if(!R.ans&&/^[a-e]$/.test(k)&&LET.indexOf(k.toUpperCase())<R.perm.length){pick(LET.indexOf(k.toUpperCase()));e.preventDefault()}
  else if(!R.ans&&/^[1-5]$/.test(k)&&+k<=R.perm.length){pick(+k-1);e.preventDefault()}
  else if(e.key==='Enter'){if((document.activeElement||{}).tagName==='BUTTON')return;if(R.ans)nextQ();else answer();e.preventDefault()}});

const ICON={hoje:'<path d="M5 4h14v16H5zM8 9h8M8 13h8M8 17h5"/>',treino:'<path d="M4 5h16l-6 8v6l-4-2v-4z"/>',pan:'<path d="M5 20V10M12 20V4M19 20v-8"/>',banco:'<path d="M4 6h16M4 12h16M4 18h10"/>',mais:'<circle cx="6" cy="12" r="1.6"/><circle cx="12" cy="12" r="1.6"/><circle cx="18" cy="12" r="1.6"/>'};
const TABS=[['hoje','Hoje'],['treino','Treino'],['pan','Painel'],['banco','Banco'],['mais','Mais']];
function go(t){S.tab=t;render();scrollTo(0,0)}

const linkEstudo=()=>`<a class="lk" href="../">Abrir o app de estudo</a>`;

/* ===== Hoje ===== */
function vHoje(){const t=todayNum(),c=cfg(),dow=new Date(t*DAY).getUTCDay(),ms=ROT[dow];
  const P=buildDay(),at=answeredToday(),tot=P.due.length+P.novas.length,nOpen=BANK.filter(qOpen).length;

  <div class="chips" style="margin-top:8px">${ms?ms.map(m=>`<span class="chip on">${esc(MABR[m])}</span>`).join(''):'<span class="chip on">Domingo: questões de todas as matérias</span>'}</div>
  <div class="tiles" style="margin-top:12px"><div class="tile"><div class="l">Respondidas hoje</div><div class="n">${at.n}<span class="sub"> / ${c.meta}</span></div><div class="bar" style="margin-top:6px"><i style="width:${Math.min(100,at.n/c.meta*100)}%;background:var(--ok)"></i></div></div>
  <div class="tile"><div class="l">Acerto hoje</div><div class="n">${pct(at.k,at.n)}</div><div class="sub">${at.k} de ${at.n}</div></div></div>`;

  h+=`<div class="card" style="margin-top:12px"><div class="row sp"><div class="tag">Fila de hoje</div><span class="badge b-neu">≈ ${Math.max(1,Math.round(tot*1.3))} min</span></div>
  <div class="tiles t3" style="margin-top:8px"><div class="tile"><div class="l">Revisões</div><div class="n">${P.due.length}</div></div><div class="tile"><div class="l">Novas</div><div class="n">${P.novas.length}</div></div><div class="tile"><div class="l">Total</div><div class="n">${tot}</div></div></div>
  ${P.dueMais?`<div class="sub" style="margin-top:8px">+${P.dueMais} vencidas ficam para os próximos dias (limite de ${c.maxRev} revisões por dia).</div>`:''}
  <div class="row wr" style="margin-top:12px">${tot?`<button class="btn g grow" onclick="startDay()">${at.n?'Continuar':'Começar'} (${tot})</button>`:''}
  ${!tot&&at.n>=c.meta?`<div class="grow"><b>Meta do dia cumprida.</b><div class="sub">Quer mais? Faça questões extras.</div></div>`:''}
  ${!tot&&at.n<c.meta?`<div class="grow sub">Não há questões novas nem vencidas nos tópicos liberados. Libere mais tópicos ou importe questões.</div>`:''}

  return h+`<div class="sub" style="margin-top:6px">${linkEstudo()} · <a class="lk" href="#" onclick="openLib();return false">Tópicos liberados (${D.lib.length} manuais)</a></div>`}
function fore(n){const t=todayNum(),c=[];for(let d=0;d<n;d++)c.push(0);
  for(const q of BANK){const s=D.est[q.id];if(!s)continue;const x=Math.max(0,s.d-t);if(x<n)c[x]++}
  if(!c.some(Boolean))return '<div class="empty" style="padding:14px 4px">Nenhuma revisão agendada ainda. O que você responder volta aqui, no dia certo.</div>';

/* ===== Treino livre (filtros no estilo QConcursos) ===== */
function filt(f){const t=todayNum();return BANK.filter(q=>{
  if(f.m&&q.m!==f.m)return false;if(f.t&&q.t!==f.t)return false;if(f.n&&q.n!==+f.n)return false;
  if(!f.todos&&!qOpen(q))return false;const s=D.est[q.id];
  if(f.st==='nr'&&s)return false;if(f.st==='err'&&!(s&&s.s===0))return false;if(f.st==='venc'&&!(s&&s.d<=t))return false;if(f.st==='res'&&!s)return false;
  if(f.st==='flag'&&!D.flag[q.id])return false;if(f.st==='nota'&&!D.nota[q.id])return false;
  if(f.orig==='min'&&q.imp)return false;if(f.orig==='imp'&&!q.imp)return false;return true})}
function tfSet(k,v){S.tf[k]=k==='todos'?v:v;if(k==='m')S.tf.t='';render()}
function vTreino(){const f=S.tf,n=filt(f).length;

  <label>Assunto</label>${sel('t',[['','Todos'],...tops.map(i=>[i.id,i.a+' — '+i.s+' ('+BANK.filter(q=>q.t===i.id).length+')'])])}
  <div class="g2"><div><label>Nível</label>${sel('n',[['','Todos'],['1','Básico'],['2','Intermediário'],['3','Avançado']])}</div><div><label>Situação</label>${sel('st',[['nr','Não resolvidas'],['err','Erradas na última vez'],['venc','Vencidas hoje'],['res','Já resolvidas'],['flag','Marcadas ⚑'],['nota','Com anotação'],['todas','Todas']])}</div></div>
  <div class="g2"><div><label>Origem</label>${sel('orig',[['','Todas'],['min','Do app'],['imp','Importadas']])}</div><div><label>Quantidade</label>${sel('qtd',[['10','10'],['20','20'],['30','30'],['50','50'],['100','100']])}</div></div>
  <div class="row" style="margin-top:12px"><input type="checkbox" id="td" ${f.todos?'checked':''} onchange="tfSet('todos',this.checked)"><label for="td" style="margin:0;flex:1">Incluir tópicos que ainda não liberei</label></div></div>
  <div class="row sp"><div><b>${n}</b> questões encontradas</div><button class="btn g" ${n?'':'disabled'} onclick="startFiltro()">Resolver ${Math.min(n,+f.qtd)}</button></div>`}
function startFiltro(){const l=shuf(filt(S.tf)).slice(0,+S.tf.qtd);startRun(l.map(q=>q.id),'livre')}

/* ===== Painel ===== */
function vPan(){const t=todayNum(),H=D.hist,tot=H.length,ok=H.reduce((s,h)=>s+h.ok,0);
  const w=H.filter(h=>h.d>t-7),ok7=w.reduce((s,h)=>s+h.ok,0),days=new Set(H.map(h=>h.d));let st=0,d=days.has(t)?t:t-1;while(days.has(d)){st++;d--}
  const pm={},pt={};for(const h of H){const q=QM.get(h.q);if(!q)continue;(pm[q.m]=pm[q.m]||{n:0,k:0});pm[q.m].n++;pm[q.m].k+=h.ok;if(q.t){(pt[q.t]=pt[q.t]||{n:0,k:0});pt[q.t].n++;pt[q.t].k+=h.ok}}
  const E=Object.entries(D.est).filter(([id])=>QM.has(id)).map(([,s])=>s);
  const pipe=[['Novas liberadas',BANK.filter(q=>!D.est[q.id]&&qOpen(q)).length],['Aprendendo (0 a 1 acerto seguido)',E.filter(s=>s.k<=1).length],['Consolidando (2 a 3)',E.filter(s=>s.k>=2&&s.k<=3).length],['Dominadas (4 ou mais)',E.filter(s=>s.k>=4).length]];
  const leech=BANK.filter(q=>D.est[q.id]&&D.est[q.id].lp>=4);
  const fracos=Object.entries(pt).filter(([,v])=>v.n>=5).sort((a,b)=>a[1].k/a[1].n-b[1].k/b[1].n).slice(0,8);
  const dd=[];for(let i=13;i>=0;i--){const x=t-i,hs=H.filter(h=>h.d===x);dd.push({x,n:hs.length,k:hs.reduce((s,h)=>s+h.ok,0)})}const mx=Math.max(1,...dd.map(a=>a.n));
  return `<h1>Painel</h1><div class="sub">Estatísticas das questões respondidas</div>

function vBanco(){const q=norm(S.bq);let l=BANK.filter(x=>!q||norm(x.id+' '+x.e+' '+x.as+' '+x.ss+' '+x.m).includes(q));const tot=l.length;l=l.slice(0,S.bn);
  const cnt=MATS.map(m=>{const a=BANK.filter(x=>x.m===m);return `<tr><td>${esc(MABR[m])}</td><td>${a.length}</td><td>${a.filter(x=>D.est[x.id]).length}</td><td>${a.filter(x=>qOpen(x)&&!D.est[x.id]).length}</td></tr>`}).join('');
  return `<h1>Banco</h1><div class="sub">${BANK.length} questões, ${D.imp.length} importadas por você</div>
  <div class="row wr" style="margin-top:12px"><button class="btn p grow" onclick="openImp()">Importar questões</button><button class="btn grow" onclick="openLib()">Tópicos liberados</button></div>

  <label>Buscar</label><input type="search" value="${esc(S.bq)}" placeholder="Código, assunto ou palavra do enunciado" oninput="S.bq=this.value;bancoLista()">
  <div id="bl" class="card" style="margin-top:10px">${bancoRows(l,tot)}</div>`}
function bancoRows(l,tot){return (l.map(x=>{const s=D.est[x.id];return `<div class="qrow"><div class="grow"><b>${esc(x.id)}</b> · ${esc(MABR[x.m]||x.m)} · ${NIV[x.n]}${D.flag[x.id]?' · ⚑':''}<div class="sub">${esc(x.as||'')}${x.ss?' — '+esc(x.ss):''}</div><div class="sub">${esc(x.e.slice(0,90))}${x.e.length>90?'…':''}</div></div><div style="text-align:right"><span class="badge ${s?(s.s?'b-ok':'b-alta'):'b-neu'}">${s?(s.s?'acertou':'errou'):'nova'}</span><br><button class="btn s" style="margin-top:6px" onclick="qView('${x.id}')">Ver</button></div></div>`}).join('')||'<div class="empty">Nada encontrado.</div>')+(tot>l.length?`<div class="row" style="margin-top:8px"><button class="btn s" onclick="S.bn+=30;bancoLista()">Mostrar mais (${tot-l.length})</button></div>`:'')}
function bancoLista(){const q=norm(S.bq);const l=BANK.filter(x=>!q||norm(x.id+' '+x.e+' '+x.as+' '+x.ss+' '+x.m).includes(q));$('#bl').innerHTML=bancoRows(l.slice(0,S.bn),l.length)}
function qView(id){S.sheet={k:'view',id};renderSheet()}
function renderSheet(){const sh=$('#sh'),X=S.sheet;if(!X){sh.innerHTML='';return}
  if(X.k==='view'){const q=QM.get(X.id);if(!q){S.sheet=null;sh.innerHTML='';return}const id=[...Array(q.a.length).keys()];
    sh.innerHTML=`<div class="sheet" onclick="if(event.target===this)closeSheet()"><div><div class="tag">${esc(q.id)} · ${esc(MABR[q.m]||q.m)} · ${NIV[q.n]}</div><div class="sub">${esc(q.as||'')}${q.ss?' — '+esc(q.ss):''}</div>
    ${qBlock(q,id,null)}<div class="sim-com"><b>Comentário</b>\n${qTxt(q,id)}</div>${q.b?`<div class="sub" style="margin-top:8px">${fmt(q.b)}</div>`:''}
    <div class="row wr" style="margin-top:14px"><button class="btn g grow" onclick="closeSheet();startRun(['${q.id}'],'livre')">Resolver esta</button>${q.imp?`<button class="btn d" onclick="delImp('${q.id}')">Excluir</button>`:''}<button class="btn" onclick="closeSheet()">Fechar</button></div></div></div>`}
  else if(X.k==='lib')sh.innerHTML=libSheet();

function delImp(id){D.imp=D.imp.filter(q=>q.id!==id);delete D.est[id];save();setBank();closeSheet();render();toast('Questão excluída')}

function openLib(){S.sheet={k:'lib'};renderSheet()}
function libSheet(){const by=new Map();for(const i of ED){const n=BANK.filter(q=>q.t===i.id).length;if(!by.has(i.m))by.set(i.m,[]);by.get(i.m).push({i,n})}
  return `<div class="sheet" onclick="if(event.target===this)closeSheet()"><div><h1>Tópicos liberados</h1><div class="sub">Questões novas só aparecem para tópicos liberados. Os que você marcou como estudados no app de estudo entram sozinhos. Tópicos liberados só aqui funcionam normalmente, mas o app de estudo só recebe os resultados dos tópicos que você já iniciou lá.</div>
  <div class="row" style="margin-top:10px"><input type="checkbox" id="la" ${S.libAll?'checked':''} onchange="S.libAll=this.checked;renderSheet()"><label for="la" style="margin:0">Mostrar também tópicos sem questões</label></div>
  ${[...by.entries()].map(([m,l])=>{const rows=l.filter(x=>S.libAll||x.n);if(!rows.length)return '';return `<h2>${esc(m)}</h2><div class="row wr"><button class="btn s" onclick="libN('${esc(m)}',3)">Liberar os 3 primeiros</button><button class="btn s" onclick="libN('${esc(m)}',6)">6 primeiros</button><button class="btn s" onclick="libN('${esc(m)}',0)">Limpar</button></div>
  ${rows.map(({i,n})=>{const st=studied(i.id),on=st||D.lib.includes(i.id);return `<div class="libr"><input type="checkbox" id="l_${i.id}" ${on?'checked':''} ${st?'disabled':''} onchange="libTog('${i.id}')"><label for="l_${i.id}">${esc(i.a)} — ${esc(i.s)}<div class="sub">${n} ${n===1?'questão':'questões'}${st?' · marcado como estudado no app de estudo':''}</div></label></div>`}).join('')}`}).join('')}
  <button class="btn p" style="width:100%;margin-top:16px" onclick="closeSheet();render()">Pronto</button></div></div>`}
function libTog(id){const k=D.lib.indexOf(id);if(k>=0)D.lib.splice(k,1);else D.lib.push(id);lvC.clear();save();renderSheet()}
function libN(m,n){const ids=ED.filter(i=>i.m===m&&BANK.some(q=>q.t===i.id)).map(i=>i.id);D.lib=D.lib.filter(x=>!ids.includes(x));if(n)D.lib.push(...ids.slice(0,n));lvC.clear();save();renderSheet()}

/* importação: texto colado (modelo abaixo) ou JSON */
const MODELO=`Disciplina: Noções de Direito Constitucional
Assunto: Direitos individuais e coletivos
Nível: 2
Enunciado: Texto da questão, em quantas linhas precisar.
A) primeira alternativa
B) segunda alternativa
C) terceira alternativa
D) quarta alternativa
E) quinta alternativa
Gabarito: C
Comentário: explicação opcional
Fonte: QConcursos Q123456 (opcional)
---
Disciplina: Língua Portuguesa
Enunciado: Questão de Certo ou Errado, sem alternativas.
Gabarito: Certo`;
function openImp(){S.pi=null;S.sheet={k:'imp'};renderSheet()}
function matchMat(s){const x=norm(s);if(/processual/.test(x))return MAT.DPT;if(/portugu/.test(x))return MAT.PT;if(/inform/.test(x))return MAT.INF;if(/constituc/.test(x))return MAT.CON;if(/administrat/.test(x))return MAT.ADM;if(/legisla|8\.?112|9\.?784|8\.?429|lgpd/.test(x))return MAT.LEG;if(/trabalh|clt/.test(x))return MAT.DT;return ''}
function parseNiv(s){const x=norm(s);if(/^[123]$/.test(x.trim()))return +x.trim();if(/basic|facil|inici/.test(x))return 1;if(/avanc|dificil/.test(x))return 3;return 2}
function suggest(m,as){if(!m||!as)return '';const w=new Set(norm(as).split(/[^a-z0-9]+/).filter(x=>x.length>=4));let best='',sc=0;
  for(const i of ED){if(i.m!==m)continue;const ws=norm(i.a+' '+i.s).split(/[^a-z0-9]+/).filter(x=>x.length>=4);const s=ws.filter(x=>w.has(x)).length;if(s>sc){sc=s;best=i.id}}return best}
function parseBlock(b){const o={m:'',as:'',n:2,e:'',a:[],gs:'',c:'',src:''};let cur=null,m;
  for(const raw of b.replace(/\r/g,'').split('\n')){const l=raw.trim();if(!l){if(cur==='e'||cur==='c')o[cur]+='\n';continue}
    if(m=l.match(/^(disciplina|mat[eé]ria)\s*:\s*(.*)$/i)){o.m=m[2];cur=null;continue}
    if(m=l.match(/^(assunto|t[oó]pico)\s*:\s*(.*)$/i)){o.as=m[2];cur=null;continue}
    if(m=l.match(/^(n[ií]vel|dificuldade)\s*:\s*(.*)$/i)){o.n=parseNiv(m[2]);cur=null;continue}
    if(m=l.match(/^(enunciado|quest[aã]o)\s*:\s*(.*)$/i)){o.e=m[2];cur='e';continue}
    if(m=l.match(/^(gabarito|resposta)\s*:\s*(.*)$/i)){o.gs=m[2].trim();cur=null;continue}
    if(m=l.match(/^(coment[aá]rio|explica[cç][aã]o)\s*:\s*(.*)$/i)){o.c=m[2];cur='c';continue}
    if(m=l.match(/^(fonte|origem|banca)\s*:\s*(.*)$/i)){o.src=m[2];cur=null;continue}
    if((m=l.match(/^\(?([A-Ea-e])[\)\.\-:]\s*(.+)$/))&&LET[o.a.length]===m[1].toUpperCase()&&(o.e||o.a.length)){o.a.push(m[2]);cur='a';continue}
    if(cur==='e'||cur==='c')o[cur]+=(o[cur]&&!o[cur].endsWith('\n')?'\n':'')+l;else if(cur==='a'&&o.a.length)o.a[o.a.length-1]+=' '+l;else if(!o.e){o.e=l;cur='e'}}
  o.e=o.e.trim();o.c=o.c.trim();
  let g=null;const gs=norm(o.gs);
  if(!o.a.length&&/^(c|certo|e|errado)$/.test(gs)){o.a=['Certo','Errado'];g=/^c/.test(gs)?0:1}
  else{const mm=o.gs.match(/([A-Ea-e])/);if(mm)g=LET.indexOf(mm[1].toUpperCase())}
  o.g=g;o.erro=!o.e?'sem enunciado':o.a.length<2?'menos de 2 alternativas':(g==null||g<0||g>=o.a.length)?'gabarito inválido':'';
  return o}
function impParse(){const txt=$('#itx').value.trim();if(!txt)return toast('Cole as questões primeiro');let L=[];
  if(/^[\[{]/.test(txt)){try{let j=JSON.parse(txt);if(!Array.isArray(j))j=[j];L=j.map(x=>{const a=(x.a||x.alts||[]).map(String);let g=x.g;if(typeof g==='string')g=LET.indexOf(g.toUpperCase());const o={m:x.m||'',as:x.as||x.assunto||'',n:+x.n||2,e:String(x.e||x.enunciado||''),a,g,c:x.c||x.comentario||'',src:x.src||x.fonte||'',t:x.t||''};o.erro=!o.e?'sem enunciado':a.length<2?'menos de 2 alternativas':(g==null||g<0||g>=a.length)?'gabarito inválido':'';return o})}catch(e){return toast('JSON inválido')}}
  else L=txt.split(/\n\s*-{3,}\s*(?:\n|$)/).map(s=>s.trim()).filter(Boolean).map(parseBlock);
  S.pi=L.map(o=>{const m=matchMat(o.m)||(o.t&&TOP.get(o.t)?TOP.get(o.t).m:'');return {...o,m,t:o.t&&TOP.has(o.t)?o.t:suggest(m,o.as)}});renderSheet()}
function piSet(i,k,v){S.pi[i][k]=v;if(k==='m')S.pi[i].t=suggest(v,S.pi[i].as);renderSheet()}
function impSheet(){const P=S.pi;
  let h=`<div class="sheet" onclick="if(event.target===this)closeSheet()"><div><h1>Importar questões</h1>`;
  if(!P){h+=`<div class="sub">Cole abaixo as questões no modelo (ou um JSON). O app não busca nada no QConcursos: você resolve lá e copia para cá o que quiser guardar na revisão espaçada.</div>
  <label>Questões</label><textarea id="itx" style="min-height:200px" placeholder="Cole aqui…"></textarea>
  <div class="row wr" style="margin-top:10px"><button class="btn p grow" onclick="impParse()">Analisar</button><button class="btn" onclick="copyModelo()">Copiar modelo</button><button class="btn" onclick="closeSheet()">Fechar</button></div>
  <h2>Modelo</h2><pre class="t">${esc(MODELO)}</pre><div class="sub">Separe as questões com uma linha “---”. Disciplina, Assunto, Nível, Comentário e Fonte são opcionais. Alternativas de A a E, ou nenhuma para Certo/Errado.</div>`}
  else{const ok=P.filter(x=>!x.erro).length;
    h+=`<div class="sub">${P.length} encontradas, ${ok} válidas. Confira a disciplina e o tópico do edital de cada uma.</div>
    ${P.map((x,i)=>`<div class="card" style="margin-top:10px"><div class="row sp"><b>#${i+1}</b>${x.erro?`<span class="badge b-alta">${esc(x.erro)}</span>`:'<span class="badge b-ok">ok</span>'}</div><div class="sub" style="white-space:pre-line">${esc(x.e.slice(0,160))}${x.e.length>160?'…':''}</div>
    ${x.erro?'':`<div class="g2"><div><label>Disciplina</label><select onchange="piSet(${i},'m',this.value)"><option value="">(escolher)</option>${MATS.map(m=>`<option ${x.m===m?'selected':''} value="${esc(m)}">${esc(MABR[m])}</option>`).join('')}</select></div>
    <div><label>Nível</label><select onchange="piSet(${i},'n',+this.value)">${[1,2,3].map(n=>`<option value="${n}" ${x.n===n?'selected':''}>${NIV[n]}</option>`).join('')}</select></div></div>
    <label>Tópico do edital</label><select onchange="piSet(${i},'t',this.value)"><option value="">(sem tópico: sempre disponível)</option>${ED.filter(t=>t.m===x.m).map(t=>`<option value="${t.id}" ${x.t===t.id?'selected':''}>${esc(t.a)} — ${esc(t.s)}</option>`).join('')}</select>`}</div>`).join('')}
    <div class="row wr" style="margin-top:12px"><button class="btn g grow" ${ok?'':'disabled'} onclick="impGo()">Importar ${ok}</button><button class="btn" onclick="S.pi=null;renderSheet()">Voltar</button></div>`}
  return h+`</div></div>`}
function impGo(){const have=new Set(BANK.map(q=>q.id));let n=0,dup=0;
  for(const x of S.pi){if(x.erro)continue;const id='u-'+hash(x.e+'|'+x.a.join('|'));if(have.has(id)){dup++;continue}
    const q={id,t:x.t||'',n:x.n,e:x.e,a:x.a,g:x.g,c:x.c,src:x.src,imp:1,fx:1};if(!q.t){q.m=x.m||'Outras';q.as=x.as}D.imp.push(q);have.add(id);n++}
  save();setBank();S.pi=null;S.sheet=null;render();toast(n+' questões importadas'+(dup?' ('+dup+' já existiam)':''))}
async function copyModelo(){try{await navigator.clipboard.writeText(MODELO);toast('Modelo copiado')}catch(e){toast('Não foi possível copiar. Selecione o texto do modelo.')}}

  <div class="sub" style="margin:16px 0 6px">Questões TRT3 Técnico · versão 1</div>`}
function setC(k,v){if(k==='meta'||k==='novasMin'||k==='maxRev'){v=Math.max(0,Math.round(+v)||0);if(k!=='novasMin'&&v<5)v=5}D.cfg[k]=v;save();render()}
function setLad(v){if(v==='x')return;D.cfg.lad=LADS[v];save();render()}
function setLadTxt(s){const a=s.split(/[,;\s]+/).map(Number).filter(x=>x>0&&x<=730).map(Math.round);if(a.length<2||a.some((x,i)=>i&&x<a[i-1]))return toast('Use números crescentes, como 3, 7, 15, 30');D.cfg.lad=a;save();render()}
function setNiv(m,v){D.cfg.niv=Object.assign({},D.cfg.niv,{[m]:v});lvC.clear();save();render()}
async function copyFlags(){const t=Object.keys(D.flag).map(id=>{const q=QM.get(id);return id+' | '+(q?MABR[q.m]:'?')+' | '+(D.nota[id]||'')}).join('\n');try{await navigator.clipboard.writeText(t);toast('Lista copiada. Cole no chat com o Claude.')}catch(e){toast('Não foi possível copiar')}}
function expBackup(){const b=new Blob([JSON.stringify({app:'questoes-trt3',gerado:new Date().toISOString(),D})],{type:'application/json'}),u=URL.createObjectURL(b),a=document.createElement('a');a.href=u;a.download='backup_questoes_'+iso(todayNum())+'.json';document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(u),4000);toast('Backup pronto')}
async function impBackup(inp){const f=inp.files[0];inp.value='';if(!f)return;let j;try{j=JSON.parse(await f.text())}catch(e){return toast('Arquivo inválido')}
  if(j.app!=='questoes-trt3'||!j.D||!j.D.est)return toast('Não é um backup deste app');
  if(S.pc!==f.name+f.size){S.pc=f.name+f.size;return toast('Restaurar substitui tudo o que está aqui. Escolha o arquivo de novo para confirmar.')}
  S.pc=null;D=Object.assign(def(),j.D);lvC.clear();save();setBank();render();toast('Backup restaurado')}

/* ===== início ===== */
async function init(){
  try{EDFALL=await fetch('edital.json',{cache:'no-store'}).then(r=>r.json())}catch(e){EDFALL=[]}
  loadEdital();await loadBank();S.ready=true;render();
  window.addEventListener('storage',e=>{if(e.key===KEY){D=load();lvC.clear();setBank();if(!S.run)render()}else if(e.key===SHK){loadEdital();setBank();if(!S.run)render()}});
  if('serviceWorker' in navigator&&location.protocol.startsWith('http'))navigator.serviceWorker.register('../sw.js',{scope:'../'}).catch(()=>{})}
render();init();
</script>
