<script>
/* ===== MOTOR (mesmas regras da planilha) ===== */
const DAY = 864e5;
function dn(iso){ if(!iso) return null; const p=iso.split('-'); return Math.floor(Date.UTC(+p[0],+p[1]-1,+p[2])/DAY); }
function iso(n){ const d=new Date(n*DAY); return d.getUTCFullYear()+'-'+String(d.getUTCMonth()+1).padStart(2,'0')+'-'+String(d.getUTCDate()).padStart(2,'0'); }
function todayNum(){ const t=new Date(); return Math.floor(Date.UTC(t.getFullYear(),t.getMonth(),t.getDate())/DAY); }
function keyOf(m,a,s){ return ((m||'')+'|'+(a||'')+'|'+(s||'')).toLowerCase().replace(/\s+/g,' ').trim(); }
const DEFAULT_CFG = {limite:4,minAmostra:5,minLadder:3,altaPct:0.7,consPct:0.85,janela:7,escada:[1,7,30],degExtra:0,fAcAlto:1,fAcMed:1,fAcBaixo:1,fPeso5:1,fPeso4:1,fPeso3:1,fPeso12:1,pctZera:0.5,pctAlto:0.9,pctMed:0.8,dataPadrao:'2026-11-13',wRecente:0.6,prior:0.3,forca:10,qtdEq:5,satErro:0.5,horizonte:30,atrasoSat:14,urgVenc:0.85,ptsErro:50,ptsUrg:35,ptsPeso:15,minSubir:0.7,ativosFrente:true,pesosV2:1};

/* escada adaptativa: degraus 1-3-7-14-30 (+60) ajustados pelo acerto e pelo peso.
   - ponto de partida: o histórico do cadastro (questões anteriores ao app) já posiciona o assunto num degrau;
   - revisão boa sobe um degrau; ruim desce dois; abaixo de pctZera volta ao início;
   - amostra pequena mantém o degrau, mas soma com as próximas sessões até chegar ao mínimo de questões;
   - degrau extra só para acerto alto (>= pctAlto) em assunto de peso até 3. */
function fPeso(peso,cfg){peso=+peso||3;return peso>=5?cfg.fPeso5:peso>=4?cfg.fPeso4:peso>=3?cfg.fPeso3:cfg.fPeso12}
function fAc(pct,cfg){return pct>=cfg.pctAlto?cfg.fAcAlto:pct>=cfg.pctMed?cfg.fAcMed:cfg.fAcBaixo}
function degInicial(hist,cfg){return hist&&hist.v0!=null?+hist.v0:-1}
function intervalo(V,pct,conf,peso,cfg){const E=cfg.escada,top=E.length-1;const base=V>top?cfg.degExtra:E[Math.max(0,Math.min(V,top))];
  return Math.max(1,Math.round(base*fPeso(peso,cfg)*(conf&&pct!=null?fAc(pct,cfg):1)))}
function ladder(list, cfg, peso, hist){
  const top=cfg.escada.length-1; let V=Math.min(degInicial(hist,cfg),top), bq=0, ba=0;
  return list.map(s=>{
    const q=+s.q||0, pct=q>0?(+s.ac||0)/q:0;
    bq+=q; ba+=+s.ac||0;                       /* soma as amostras pequenas até atingir o mínimo */
    const conf=bq>=(cfg.minLadder||cfg.minAmostra), pp=bq>0?ba/bq:0;
    const boa=conf&&pp>=cfg.minSubir, ruim=conf&&pp<cfg.minSubir;
    if(boa){ V+=1; const max=(cfg.degExtra>0&&pp>=cfg.pctAlto&&(+peso||3)<=3)?top+1:top; V=Math.min(V,max); }
    else if(ruim) V=pp<cfg.pctZera?0:Math.max(0,V-2);
    let interval=intervalo(V,pp,conf,peso,cfg);
    if(conf){bq=0;ba=0}
    return Object.assign({},s,{pct,boa,ruim,V,interval,next:dn(s.d)+interval});
  });
}
function stOf(it,U){const ck=it.ck||[];if(it.st==='conc'||(ck.length===4&&ck.every(Boolean)))return 'conc';if(it.st==='nao'&&!U)return 'nao';if(it.st==='est'||ck.some(Boolean)||U>0||it.d0)return 'est';return 'nao'}
function sortSess(a,b){ return dn(a.d)-dn(b.d) || (a.n||0)-(b.n||0); }
function round1(x){ return Math.round(x*10)/10; }

function compute(items, sessions, cfg, today){
  const byKey=new Map();
  for(const s of sessions){ const k=keyOf(s.m,s.a,s.s); if(!byKey.has(k)) byKey.set(k,[]); byKey.get(k).push(s); }
  const known=new Set(items.map(i=>keyOf(i.m,i.a,i.s)));
  const orphan=sessions.filter(s=>!known.has(keyOf(s.m,s.a,s.s)));
  const rows=items.map((it,idx)=>{
    const k=keyOf(it.m,it.a,it.s);
    const X0=+it.q0||0, hist={q:X0>0?X0:(it.p0!=null?cfg.minAmostra:0),p:X0>0?(+it.a0||0)/X0:(it.p0==null?null:+it.p0),v0:it.v0};
    const sess=ladder((byKey.get(k)||[]).slice().sort(sortSess),cfg,it.peso,hist);
    const U=sess.length, last=U?sess[U-1]:null, first=U?sess[0]:null;
    const qSes=sess.reduce((t,s)=>t+(+s.q||0),0), aSes=sess.reduce((t,s)=>t+(+s.ac||0),0);
    const X=+it.q0||0, Y=+it.a0||0;
    const qTot=qSes+X, aTot=aSes+Y;
    const pInf=(it.p0==null)?null:+it.p0;
    const pHist=qTot>0?aTot/qTot:pInf;
    const AA=(X+qSes===0 && pInf!=null)?1:0;
    let M=null; if(U) M=dn(last.d); else if(it.d0) M=dn(it.d0); else if(X>0||AA) M=dn(cfg.dataPadrao);
    const N=U?last.interval:(M!=null?intervalo(degInicial(hist,cfg),hist.p,hist.q>=cfg.minAmostra,it.peso,cfg):null);
    const AS=(!U&&it.rev0)?dn(it.rev0):((M!=null&&N!=null)?M+N:null);
    let AB=null, AC=null;
    if(U){AB=last.q;AC=last.ac;} else if(X>0){AB=X;AC=Y;}
    let AD=null; if(AB!=null&&AB>0) AD=AC/AB; else if(AA) AD=pInf;
    const conf=(AB!=null&&AB>=cfg.minAmostra);
    let pri='';
    if(AD!=null){ pri=AA?'⚪ QTD DESCONHECIDA':!conf?'⚪ AMOSTRA PEQUENA':AD<cfg.altaPct?'🔴 ALTA':AD<cfg.consPct?'🟠 MÉDIA':'🟢 CONSOLIDADO'; }
    const peso=it.peso||3;
    const ABe=(AB==null||AB===0)?cfg.qtdEq:AB;
    let AG=null; if(AD==null){ if(AS!=null) AG=cfg.prior; } else AG=(ABe*(1-AD)+cfg.forca*cfg.prior)/(ABe+cfg.forca);
    let AH=null; if(pHist!=null){ const Ee=qTot>0?qTot:cfg.qtdEq; AH=(Ee*(1-pHist)+cfg.forca*cfg.prior)/(Ee+cfg.forca); }
    const AI=AG==null?null:Math.min(1,(cfg.wRecente*AG+(1-cfg.wRecente)*(AH==null?AG:AH))/cfg.satErro);
    const AT=AS==null?null:AS-today;
    const AJ=AT==null?0:(AT<=0?cfg.urgVenc+(1-cfg.urgVenc)*Math.min(1,-AT/cfg.atrasoSat):Math.max(0,cfg.urgVenc*(1-AT/cfg.horizonte)));
    const idxP=AI==null?null:round1(cfg.ptsErro*AI+cfg.ptsUrg*AJ+cfg.ptsPeso*peso/5);
    const variacao=(U>=2&&conf!=null&&last&&first)?(last.pct-first.pct):null;
    return {it,idx,key:k,sess,U,last,first,qTot,aTot,pHist,AA,M,N,AS,AB,AC,AD,conf,pri,peso,idxP,AT,st:stOf(it,U),ativo:(U>0||!!it.d0),variacao,plan:null};
  });
  /* nivelamento: no máximo N assuntos por dia; ativos primeiro, estoque preenche as vagas */
  const doneKeys=new Set(sessions.filter(s=>dn(s.d)===today).map(s=>keyOf(s.m,s.a,s.s)));
  const doneToday=doneKeys.size;
  const cap=new Map(); const capOf=d=>cap.has(d)?cap.get(d):Math.max(0,cfg.limite-(d===today?doneToday:0));
  const take=(r,from)=>{ let d=from; while(capOf(d)<=0) d++; cap.set(d,capOf(d)-1); r.plan=d; };
  const cand=rows.filter(r=>r.AS!=null&&!doneKeys.has(r.key));
  const ativos=cfg.ativosFrente?cand.filter(r=>r.ativo):cand;
  const estoque=cfg.ativosFrente?cand.filter(r=>!r.ativo):[];
  ativos.sort((a,b)=>(Math.max(today,a.AS)-Math.max(today,b.AS))||((b.idxP||0)-(a.idxP||0))||(a.idx-b.idx));
  for(const r of ativos) take(r,Math.max(today,r.AS));
  estoque.sort((a,b)=>((b.idxP||0)-(a.idxP||0))||(a.idx-b.idx));
  for(const r of estoque) take(r,today);
  const byDay=new Map();
  for(const r of rows) if(r.plan!=null){ if(!byDay.has(r.plan)) byDay.set(r.plan,[]); byDay.get(r.plan).push(r); }
  for(const l of byDay.values()) l.sort((a,b)=>((b.idxP||0)-(a.idxP||0))||(a.idx-b.idx));
  return {rows,byDay,doneToday,orphan,today};
}

function painel(model, sessions, cfg){
  const {rows,byDay,today}=model;
  const mats=[...new Set(rows.map(r=>r.it.m))];
  const per=mats.map(m=>{
    const rs=rows.filter(r=>r.it.m===m);
    const q=rs.reduce((t,r)=>t+r.qTot,0), a=rs.reduce((t,r)=>t+r.aTot,0);
    const hoje=(byDay.get(today)||[]).filter(r=>r.it.m===m).length;
    return {m,q,a,e:q-a,pct:q>0?a/q:null,alta:rs.filter(r=>r.pri.startsWith('🔴')).length,hoje,n:rs.length,est:rs.filter(r=>r.st==='est').length,conc:rs.filter(r=>r.st==='conc').length};
  });
  const tq=per.reduce((t,p)=>t+p.q,0), ta=per.reduce((t,p)=>t+p.a,0);
  const win=(from,to)=>{ let q=0,a=0; for(const s of sessions){ const d=dn(s.d); if(d>=from&&d<=to){q+=+s.q||0;a+=+s.ac||0;} } return q>0?a/q:null; };
  const p30=win(today-29,today), p60=win(today-59,today-30);
  const multi=rows.filter(r=>r.variacao!=null);
  const up=multi.filter(r=>r.variacao>0.00001).length, down=multi.filter(r=>r.variacao<-0.00001).length;
  const media=multi.length?multi.reduce((t,r)=>t+r.variacao,0)/multi.length*100:null;
  const count=f=>rows.filter(f).length;
  const kpi={
    materias:mats.length, assuntos:rows.length, hoje:(byDay.get(today)||[]).length,
    atrasados:count(r=>r.ativo&&r.AT!=null&&r.AT<0),
    prox:[...byDay.entries()].filter(([d])=>d>today&&d<=today+cfg.janela).reduce((t,[,l])=>t+l.length,0),
    alta:count(r=>r.pri.startsWith('🔴')),media:count(r=>r.pri.startsWith('🟠')),cons:count(r=>r.pri.startsWith('🟢')),
    peq:count(r=>r.pri.startsWith('⚪')),sem:count(r=>!r.pri),est:count(r=>r.st==='est'),conc:count(r=>r.st==='conc'),nao:count(r=>r.st==='nao'),rev:count(r=>r.ativo&&r.AT!=null&&r.AT<=0)
  };
  const fracos=rows.filter(r=>r.pHist!=null&&r.qTot>=cfg.minAmostra).sort((x,y)=>x.pHist-y.pHist||x.idx-y.idx).slice(0,20);

function localDb(){
  const KEY='trt3_tecnico_db_v1';let store;
  const load=()=>{try{const o=JSON.parse(localStorage.getItem(KEY)||'null');if(o&&o.docs)return o}catch(e){}return null};
  const persist=()=>{try{localStorage.setItem(KEY,JSON.stringify(store))}catch(e){throw e}};
  store=load();
  if(!store){store={docs:{}};store.docs['app/assuntos']={items:SEED.items};store.docs['app/config']=SEED.cfg;store.docs['app/horas']={meta:1000,prova:''};persist()}
  localStorage.setItem(KEY+'_t','1');
  const subs=[];
  const docSn=p=>({exists:p in store.docs,data:()=>JSON.parse(JSON.stringify(store.docs[p]||{})),id:p.split('/').pop()});
  const colSn=c=>({docs:Object.keys(store.docs).filter(k=>k.startsWith(c+'/')&&k.indexOf('/',c.length+1)<0).map(k=>({id:k.slice(c.length+1),data:()=>JSON.parse(JSON.stringify(store.docs[k]))}))});
  const fire=()=>subs.slice().forEach(s=>{try{s.fn(s.col?colSn(s.key):docSn(s.key))}catch(e){console.error(e)}});
  const mk=p=>({set:async d=>{store.docs[p]=JSON.parse(JSON.stringify(d));persist();fire()},delete:async()=>{delete store.docs[p];persist();fire()},get:async()=>docSn(p),
    onSnapshot:fn=>{const s={fn,col:false,key:p};subs.push(s);Promise.resolve().then(()=>fn(docSn(p)));return()=>{subs.splice(subs.indexOf(s),1)}}});
  return{doc:p=>mk(p),collection:c=>({doc:id=>mk(c+'/'+id),onSnapshot:fn=>{const s={fn,col:true,key:c};subs.push(s);Promise.resolve().then(()=>fn(colSn(c)));return()=>{subs.splice(subs.indexOf(s),1)}}})}
}

async function init(){
  regLoad();try{S.regModo=sessionStorage.getItem('rc_modo')||'uma'}catch(e){}
  try{ S.db=localDb(); }catch(e){ S.db=null; }
  if(!S.db){ S.err='Armazenamento do navegador indisponível (janela privada ou bloqueado). Abra em uma janela normal para salvar seus dados.'; render(); return; }
  const chk=()=>{ if(S.ld.a&&S.ld.s&&S.ld.c){ if(!S.ready){S.ready=true; recalc(); render();} } };
  S.db.doc('app/assuntos').onSnapshot(sn=>{ S.items=sn.exists?clean(sn.data().items||[]):[]; S.hasItems=sn.exists; S.ld.a=true; recalc(); chk(); bgRender(); });
  S.db.doc('app/config').onSnapshot(sn=>{ S.cfg={...DEFAULT_CFG,...(sn.exists?clean(sn.data()):{})}; S.ld.c=true; recalc(); chk(); bgRender(); });
  S.db.collection('sessoes').onSnapshot(sn=>{ S.ses=sn.docs.map(d=>({...clean(d.data()),_id:d.id})); S.ld.s=true; recalc(); chk(); bgRender(); });
  S.db.collection('redacao').onSnapshot(sn=>{ S.red=sn.docs.map(d=>({...clean(d.data()),_id:d.id})); bgRender(); });
  S.db.collection('rotina').onSnapshot(sn=>{ const f={}; sn.docs.forEach(d=>{ f[d.id]=clean(d.data()); }); S.rot=f; bgRender(); });
  S.db.collection('horas').onSnapshot(sn=>{ S.hrs=sn.docs.map(d=>({...clean(d.data()),_id:d.id})); bgRender(); });
  S.db.doc('app/horas').onSnapshot(sn=>{ S.hcfg={meta:1000,prova:'',...(sn.exists?clean(sn.data()):{})}; bgRender(); });
  S.db.collection('simulados').onSnapshot(sn=>{ const dbs=sn.docs.map(d=>({...clean(d.data()),id:d.id})); S.simsDb=dbs; S.sims=simMerge(); bgRender(); });
  simLoadFiles();
  S.db.collection('sim_tent').onSnapshot(sn=>{ const keep=S.simRun&&S.tents.find(x=>x._id===S.simRun.tid); S.tents=sn.docs.map(d=>({...clean(d.data()),_id:d.id})); if(keep){const db=S.tents.find(x=>x._id===keep._id); if(!db) S.tents.push(keep); else if(keep.fim||!db.fim) S.tents=S.tents.map(x=>x._id===keep._id?keep:x)} bgRender(); });
  S.db.collection('flash').onSnapshot(sn=>{ const f={}; sn.docs.forEach(d=>{ if(d.data().ok) f[d.id]=true; }); S.flash=f; bgRender(); });
}

const ICON={hrs:'<circle cx="12" cy="12" r="8"/><path d="M12 8v4l3 2"/>',sim:'<path d="M9 5h10v14H9zM5 9v10h10M12 9h4M12 12h4"/>',cic:'<path d="M20 12a8 8 0 1 1-2.3-5.6M20 4v4h-4"/>',hoje:'<path d="M5 4h14v16H5zM8 9h8M8 13h8M8 17h5"/>',reg:'<path d="M12 5v14M5 12h14"/>',pan:'<path d="M5 20V10M12 20V4M19 20v-8"/>',ass:'<path d="M4 6h16M4 12h16M4 18h10"/>',mais:'<circle cx="6" cy="12" r="1.6"/><circle cx="12" cy="12" r="1.6"/><circle cx="18" cy="12" r="1.6"/>'};

function go(t){if(S.simRun&&t!=='sim')simFlush();S.tab=t;render();scrollTo(0,0)}
function render(){
  $('#nav').innerHTML=TABS.map(([k,l])=>`<button class="${S.tab===k?'on':''}" onclick="go('${k}')" ${S.tab===k?'aria-current="page"':''}><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">${ICON[k]}</svg>${l}</button>`).join('');

/* ---------- Hoje ---------- */
function card(r,opt={}){
  const it=r.it;
  return `<div class="card"><div class="row sp"><div class="tag">${esc(it.m)}</div>${r.pri?badge(r):`<span class="badge b-neu">${STL[r.st]}</span>`}</div>
  <div class="ttl">${esc(it.s)}</div><div class="sub">${esc(it.a)}</div>
  <div class="meta"><span>Acerto <b>${pc(r.pHist,0)}</b></span><span>Questões <b>${r.qTot}</b></span><span>Último estudo <b>${r.U?fd(r.M):(it.d0?fdi(it.d0).slice(0,5):'—')}</b></span>${r.AT!=null&&r.AT<0?`<span style="color:var(--alta)"><b>${-r.AT}d atrasado</b></span>`:''}</div>
  ${it.dup?`<div class="sub" style="margin-top:6px">${esc(it.dup)}</div>`:''}${it.chg?`<div class="sub" style="margin-top:6px;color:var(--media)">⚠ ${esc(it.chg)}</div>`:''}
  ${it.obs?`<div class="sub" style="margin-top:6px">${esc(it.obs)}</div>`:''}
  <div class="row" style="margin-top:10px"><button class="btn p s" onclick="regFor(${r.idx})">Registrar revisão</button><button class="btn s" onclick="openSel(${r.idx})">Detalhes</button></div></div>`;
}
function vHoje(){
  const t=T(), list=M.byDay.get(t)||[], lim=S.cfg.limite, done=M.doneToday;
  const d=new Date(t*864e5);
  let h=`<h1>Hoje</h1><div class="sub">${WD[d.getUTCDay()]}, ${fdi(iso(t))} · ${done} de ${lim} assuntos feitos</div>
  <div class="bar" style="margin:12px 0 14px"><i style="width:${Math.min(100,done/lim*100)}%;background:var(--ok)"></i></div>`;
  h+=planoHojeCard()+hrsMini()+atrasoBanner();
  h+=`<div class="tiles"><div class="tile"><div class="n">${list.length}</div><div class="l">Para revisar</div></div><div class="tile"><div class="n" style="color:${P.kpi.atrasados?'var(--alta)':'inherit'}">${P.kpi.atrasados}</div><div class="l">Atrasados</div></div></div>`;
  h+=`<h2>Revisar hoje</h2>`;
  h+=list.length?list.map(r=>card(r)).join(''):`<div class="empty">${done>=lim?'Meta do dia cumprida. 🎉':'Nada agendado para hoje. As revisões de 24h, 7 e 30 dias aparecem aqui a partir do dia em que você marcar “Estudei hoje” em um tópico da aba Edital ou registrar questões.'}</div>`;
  const dias=[...M.byDay.keys()].filter(k=>k>t&&k<=t+S.cfg.janela).sort((a,b)=>a-b);
  if(dias.length){ h+=`<h2>Próximos dias</h2>`;
    for(const k of dias){ const dd=new Date(k*864e5); h+=`<div class="card"><div class="tag">${WD[dd.getUTCDay()]} ${fd(k)} · ${M.byDay.get(k).length} assuntos</div>`+M.byDay.get(k).map(r=>`<div class="hist row sp" onclick="openSel(${r.idx})" style="cursor:pointer"><div class="grow"><b>${esc(r.it.s)}</b><div class="sub">${esc(r.it.m)} · ${esc(r.it.a)}</div></div>${r.pri?badge(r):''}</div>`).join('')+`</div>`; } }
  return h;
}

/* ---------- Registrar ---------- */
function regFor(idx){const it=S.items[idx];S.reg={m:it.m,a:it.a,s:it.s};S.regModo='uma';regSave();go('reg')}
const uniq=a=>[...new Set(a)];
const cmpAbc=(x,y)=>String(x).localeCompare(String(y),'pt-BR',{sensitivity:'base',numeric:true});
const rowAbc=(r1,r2)=>cmpAbc(r1.it.m,r2.it.m)||cmpAbc(r1.it.a,r2.it.a)||cmpAbc(r1.it.s,r2.it.s);
const abc=a=>a.slice().sort((x,y)=>String(x).localeCompare(String(y),'pt-BR',{sensitivity:'base',numeric:true}));
function regSave(){try{sessionStorage.setItem('rc_reg',JSON.stringify(S.reg))}catch(e){}}
function regLoad(){try{const o=JSON.parse(sessionStorage.getItem('rc_reg')||'null');if(o&&typeof o==='object')S.reg=o}catch(e){}}
function regSet(k,v){S.reg[k]=v;regSave()}
function vReg(){
  const R=S.reg, ms=abc(uniq(S.items.map(i=>i.m)));
  const as=abc(uniq(S.items.filter(i=>i.m===R.m).map(i=>i.a))), ss=abc(S.items.filter(i=>i.m===R.m&&i.a===R.a).map(i=>i.s));
  const opt=(l,v)=>l.map(x=>`<option ${x===v?'selected':''}>${esc(x)}</option>`).join('');
  const td=T();
  const v=k=>R[k]==null?'':esc(R[k]);
  return `<h1>Registrar</h1><div class="sub">Lance uma sessão de questões</div>
  <label>Matéria</label><select id="rm" onchange="S.reg={...S.reg,m:this.value,a:'',s:''};regSave();render()"><option value="">Selecione…</option>${opt(ms,R.m)}</select>
  <label>Assunto</label><select id="ra" onchange="S.reg={...S.reg,a:this.value,s:''};regSave();render()"><option value="">Selecione…</option>${opt(as,R.a)}</select>
  <label>Subassunto</label><select id="rs" onchange="regSet('s',this.value);renderPv()"><option value="">Selecione…</option>${opt(ss,R.s)}</select>
  <div class="g2"><div><label>Questões feitas</label><input id="rq" type="number" inputmode="numeric" min="0" value="${v('q')}" oninput="regSet('q',this.value);renderPv()"></div><div><label>Acertos</label><input id="rac" type="number" inputmode="numeric" min="0" value="${v('ac')}" oninput="regSet('ac',this.value);renderPv()"></div></div>
  <div class="g2"><div><label>Tipo</label><select id="rt" onchange="regSet('t',this.value)">${['Questões','Revisão','Teoria'].map(x=>`<option ${R.t===x?'selected':''}>${x}</option>`).join('')}</select></div><div><label>Data</label><input id="rd" type="date" value="${R.d||iso(td)}" onchange="regSet('d',this.value);renderPv()"></div></div>
  <label>Motivo / observação</label><input id="ro" type="text" placeholder="opcional" value="${v('o')}" oninput="regSet('o',this.value)">
  <div class="pv" id="pv"></div>
  <button class="btn p" style="width:100%;margin-top:14px" onclick="saveReg()">Salvar sessão</button>
  <h2>Histórico de sessões</h2>
  <div class="row" style="gap:6px;margin-bottom:8px">${[['hoje','Hoje'],['7','7 dias'],['tudo','Tudo']].map(([k,l])=>`<button class="btn s ${S.hf===k?'p':''}" onclick="S.hf='${k}';S.hn=30;render()">${l}</button>`).join('')}</div>
  <input id="hq" type="search" placeholder="Buscar no histórico…" value="${esc(S.hq||'')}" oninput="S.hq=this.value;S.hn=30;hrefresh()">
  <div id="hl" style="margin-top:10px">${hlist()}</div>`;
}
function hlist(){
  const td=T(), f=S.hf||'hoje', q=(S.hq||'').toLowerCase();
  let l=S.ses.filter(s=>(f==='tudo'||(f==='7'?dn(s.d)>=td-6:dn(s.d)===td))&&(!q||(s.a+' '+s.s+' '+s.m).toLowerCase().includes(q)))
    .sort((a,b)=>dn(b.d)-dn(a.d)||(b.n||0)-(a.n||0));
  const tot=l.length, n=S.hn||30; l=l.slice(0,n);
  if(!tot)return '<div class="empty">Nenhuma sessão.</div>';
  let h=`<div class="sub" style="margin-bottom:6px">${tot} sessões</div>`,last='';
  for(const s of l){ if(s.d!==last){last=s.d;h+=`<div class="tag" style="margin:12px 0 6px">${fdi(s.d)}</div>`}
    h+=`<div class="card row sp"><div class="grow"><b>${esc(s.a)}</b><div class="sub">${esc(s.m)} · ${esc(s.s)}</div><div class="sub">${s.ac}/${s.q} · ${pc(s.q?s.ac/s.q:null,0)}${s.obs?' · '+esc(s.obs):''}</div></div><div class="row" style="gap:6px;flex-shrink:0"><button class="btn s" onclick="sesEdit('${s._id}')">Editar</button><button class="btn s d" onclick="delSes('${s._id}')">Excluir</button></div></div>`; }
  if(tot>n) h+=`<button class="btn" style="width:100%" onclick="S.hn=(S.hn||30)+30;hrefresh()">Ver mais</button>`;
  return h;
}
function hrefresh(){const e=$('#hl');if(e)e.innerHTML=hlist()}
/* ---------- editar sessão do histórico ---------- */
function sesEdit(id){S.es=id;render()}
function sesEditSheet(){const s=S.ses.find(x=>x._id===S.es);if(!s){S.es=null;$('#ov').innerHTML='';return}
  $('#ov').innerHTML=`<div class="sheet" onclick="if(event.target===this)sesEditClose()"><div>
   <div class="tag">Editar sessão</div><h2 style="margin:4px 0 0">${esc(s.a)}</h2><div class="sub">${esc(s.m)} · ${esc(s.s)}</div>
   <div class="g2"><div><label>Questões feitas</label><input id="eq" type="number" inputmode="numeric" min="1" value="${+s.q||0}"></div><div><label>Acertos</label><input id="eac" type="number" inputmode="numeric" min="0" value="${+s.ac||0}"></div></div>
   <div class="g2"><div><label>Data</label><input id="ed" type="date" value="${esc(s.d)}"></div><div><label>Tipo</label><select id="et">${['Questões','Revisão','Teoria','Simulado'].map(x=>`<option ${(s.tipo||'Questões')===x?'selected':''}>${x}</option>`).join('')}</select></div></div>
   <label>Motivo / observação</label><input id="eo" type="text" value="${esc(s.obs||'')}">

   <div class="row" style="margin-top:16px;flex-wrap:wrap"><button class="btn p grow" onclick="sesEditSave()">Salvar alterações</button><button class="btn" onclick="sesEditClose()">Cancelar</button></div></div></div>`}
function sesEditClose(){S.es=null;render()}
async function sesEditSave(){const id=S.es,s=S.ses.find(x=>x._id===id);if(!s)return sesEditClose();
  const q=+$('#eq').value||0,ac=+$('#eac').value||0,d=$('#ed').value;
  if(!q||!d)return toast('Preencha questões e data');if(ac<0||ac>q)return toast('Acertos inválidos');
  const {_id,...rest}=s;const nv={...rest,q,ac,d,tipo:$('#et').value,obs:$('#eo').value};
  if(d!==s.d)nv.n=S.ses.filter(x=>x.d===d&&x._id!==id).length+1;
  S.ses=S.ses.map(x=>x._id===id?{...nv,_id:id}:x);S.es=null;recalc();render();
  try{await S.db.collection('sessoes').doc(id).set(clean(nv));toast('Sessão atualizada'+proxTxt(nv.m,nv.a,nv.s))}catch(e){toast('Não foi possível salvar a edição')}}
/* ---------- modo caderno: vários assuntos da mesma matéria em uma tela ---------- */
function regModoBar(){return `<div class="row" style="gap:6px;margin:10px 0 2px">${[['uma','Uma sessão'],['cad','Caderno (vários assuntos)']].map(([k,l])=>`<button class="btn s ${(S.regModo||'uma')===k?'p':''}" onclick="S.regModo='${k}';try{sessionStorage.setItem('rc_modo','${k}')}catch(e){};render()">${l}</button>`).join('')}</div>`}
function cadLoad(){if(S.cad)return S.cad;let o=null;try{o=JSON.parse(localStorage.getItem('rc_caderno')||'null')}catch(e){}
  S.cad=o&&typeof o==='object'&&o.cont?o:{m:'',d:iso(T()),cont:{},f:'',obs:''};return S.cad}
function cadSave(){try{localStorage.setItem('rc_caderno',JSON.stringify(S.cad))}catch(e){}}
function cadTot(){cadLoad();let q=0,a=0,n=0;const ks=new Set(S.items.map(x=>keyOf(x.m,x.a,x.s)));for(const k in S.cad.cont){const c=S.cad.cont[k];if(c.q>0&&ks.has(k)){q+=c.q;a+=c.ac;n++}}return {q,a,n}}
function cadSort(l){return l.slice().sort((x,y)=>x.m.localeCompare(y.m,'pt')||x.a.localeCompare(y.a,'pt')||x.s.localeCompare(y.s,'pt'))}
function cadItems(){const C=cadLoad();return cadSort(C.m==='*'?S.items:S.items.filter(i=>i.m===C.m))}
function cadMarcados(){const C=cadLoad();return cadSort(S.items.filter(i=>(C.cont[keyOf(i.m,i.a,i.s)]||{}).q>0))}
/* lista visível: matéria escolhida (filtrada pela busca) ou, em "todas", os já marcados + resultados da busca */
function cadLista(){const C=cadLoad(),f=(C.f||'').toLowerCase().trim(),hit=i=>(i.m+' '+i.a+' '+i.s).toLowerCase().includes(f);
  if(C.m!=='*')return cadItems().filter(i=>!f||hit(i));
  const mk=cadMarcados(),ks=new Set(mk.map(i=>keyOf(i.m,i.a,i.s)));
  const res=f.length>=2?cadItems().filter(i=>hit(i)&&!ks.has(keyOf(i.m,i.a,i.s))).slice(0,40):[];
  return f?res.concat(mk.filter(hit)):mk}
function cadListaHtml(){const C=cadLoad(),l=cadLista();
  if(l.length)return l.map(cadRow).join('');
  return '<div class="empty">'+(C.m==='*'&&(C.f||'').trim().length<2?'Digite ao menos 2 letras do assunto ou subassunto para encontrá-lo em qualquer matéria.':'Nenhum subassunto encontrado.')+'</div>'}
function cadRow(it){const k=keyOf(it.m,it.a,it.s),c=S.cad.cont[k]||{q:0,ac:0},on=c.q>0;
  return `<div class="card" id="cr-${cadId(k)}" style="padding:10px 12px;${on?'border-color:var(--acc)':''}"><div class="row sp" style="gap:8px;align-items:center">
   <div class="grow" style="min-width:0"><div class="sub" style="font-size:12px">${S.cad.m==='*'?'<b>'+esc(it.m)+'</b> · ':''}${esc(it.a)}</div><b style="font-size:14px">${esc(it.s)}</b></div>
   <div class="row" style="gap:6px;flex-shrink:0;align-items:center"><button class="btn s" title="Acertei" aria-label="Acertei" style="color:var(--ok);min-width:40px" onclick="cadBump('${cadId(k)}',1)">✓</button><button class="btn s" title="Errei" aria-label="Errei" style="color:var(--alta);min-width:40px" onclick="cadBump('${cadId(k)}',0)">✗</button></div></div>
   <div class="row" style="gap:8px;margin-top:6px;align-items:center"><span class="sub" style="font-size:12px">Questões</span><input type="number" inputmode="numeric" min="0" value="${c.q||''}" style="width:64px;padding:6px 8px;margin:0" onchange="cadSet('${cadId(k)}','q',this.value)">
   <span class="sub" style="font-size:12px">Acertos</span><input type="number" inputmode="numeric" min="0" value="${c.ac||''}" style="width:64px;padding:6px 8px;margin:0" onchange="cadSet('${cadId(k)}','ac',this.value)">
   <span class="sub" id="cp-${cadId(k)}" style="font-size:12px;margin-left:auto">${on?pc(c.ac/c.q,0):''}</span></div></div>`}
const CADK={};function cadId(k){for(const i in CADK)if(CADK[i]===k)return i;const i='k'+Object.keys(CADK).length;CADK[i]=k;return i}
function cadBump(i,ok){const k=CADK[i],c=S.cad.cont[k]||(S.cad.cont[k]={q:0,ac:0});c.q++;if(ok)c.ac++;cadSave();cadPatch(i)}
function cadSet(i,f,v){const k=CADK[i],c=S.cad.cont[k]||(S.cad.cont[k]={q:0,ac:0});c[f]=Math.max(0,Math.floor(+v||0));if(c.ac>c.q){c.ac=c.q;toast('Acertos ajustados ao número de questões')}cadSave();cadPatch(i)}
function cadPatch(i){const k=CADK[i],it=S.items.find(x=>keyOf(x.m,x.a,x.s)===k),e=$('#cr-'+i);if(it&&e){const h=document.createElement('div');h.innerHTML=cadRow(it);e.replaceWith(h.firstElementChild)}
  const tb=$('#cad-tot');if(tb)tb.innerHTML=cadTotHtml();const at=$('#cad-at');if(at)at.innerHTML=cadAtivosHtml()}
function cadTotHtml(){const t=cadTot();return t.q?`<b>${t.q}</b> questões · <b>${t.a}</b> acertos (${pc(t.a/t.q,0)}) · ${t.n} ${t.n===1?'subassunto':'subassuntos'}`:'Toque em ✓ ou ✗ a cada questão resolvida, ou digite os números.'}
const CAD_AB={'Língua Portuguesa':'Português','Noções de Informática':'Informática','Noções de Direito Constitucional':'Constitucional','Noções de Direito Administrativo':'Administrativo','Legislação':'Legislação','Noções de Direito do Trabalho':'D. Trabalho','Noções de Direito Processual do Trabalho':'P. Trabalho'};
function cadAtivosHtml(){const C=S.cad,l=cadMarcados(),ms=uniq(l.map(i=>i.m)),mix=ms.length>1||C.m==='*'||(ms[0]&&ms[0]!==C.m);
  return l.length?(mix?'<div class="sub" style="font-size:12px;margin-bottom:4px">Marcados até agora ('+ms.length+(ms.length===1?' matéria':' matérias')+'):</div>':'')+l.map(i=>{const c=C.cont[keyOf(i.m,i.a,i.s)];return `<span class="badge b-neu" style="margin:0 6px 6px 0;display:inline-block">${mix?esc(CAD_AB[i.m]||i.m)+': ':''}${(n=>esc(n.length>34?n.slice(0,32)+'…':n))(/^Todo o conteúdo/.test(i.s)?i.a:i.s)} ${c.ac}/${c.q}</span>`}).join(''):''}
function vCad(){const C=cadLoad(),ms=abc(uniq(S.items.map(i=>i.m))),f=(C.f||'').toLowerCase();
  
  return `<h1>Registrar</h1><div class="sub">Caderno de questões com vários assuntos, de uma ou de várias matérias: vá marcando cada questão e salve tudo no fim. O rascunho fica guardado neste aparelho, mesmo se fechar o app.</div>
  <div class="g2"><div><label>Matéria</label><select onchange="S.cad.m=this.value;S.cad.f='';cadSave();render()"><option value="">Selecione…</option><option value="*" ${C.m==='*'?'selected':''}>Todas as matérias (caderno misto)</option>${ms.map(x=>`<option ${x===C.m?'selected':''}>${esc(x)}</option>`).join('')}</select></div>
  <div><label>Data</label><input type="date" value="${esc(C.d||iso(T()))}" onchange="S.cad.d=this.value;cadSave()"></div></div>
  ${C.m?`<label>Buscar subassunto</label><input type="search" placeholder="${C.m==='*'?'Assunto ou subassunto, de qualquer matéria…':'Digite parte do nome…'}" value="${esc(C.f||'')}" oninput="S.cad.f=this.value;cadSave();cadFiltro()">
  <div id="cad-at" style="margin-top:10px">${cadAtivosHtml()}</div>
  <div id="cad-l" style="margin-top:6px;display:flex;flex-direction:column;gap:8px">${cadListaHtml()}</div>
  <label>Observação (vai em todas as sessões)</label><input type="text" placeholder="ex.: caderno de questões FUMARC" value="${esc(C.obs||'')}" oninput="S.cad.obs=this.value;cadSave()">
  <div style="position:sticky;bottom:calc(64px + env(safe-area-inset-bottom));background:var(--bg);padding:10px 0 4px;margin-top:10px;border-top:1px solid var(--line)">
   <div class="sub" id="cad-tot" style="margin-bottom:8px">${cadTotHtml()}</div>
   <div class="row" style="gap:8px"><button class="btn p grow" onclick="cadSalvar()">Salvar caderno</button><button class="btn" onclick="cadDescartar()">Descartar</button></div></div>`
  :'<div class="empty" style="margin-top:14px">Escolha a matéria do caderno, ou “Todas as matérias” para um caderno misto.'+(cadTot().q?' Você tem um rascunho com '+cadTot().q+' questões marcadas.':'')+'</div>'}`}
function cadFiltro(){const e=$('#cad-l');if(e)e.innerHTML=cadListaHtml()}
function cadDescartar(){if(!cadTot().q){S.cad={m:cadLoad().m,d:iso(T()),cont:{},f:'',obs:''};cadSave();return render()}
  if(S.cadDel!==1){S.cadDel=1;setTimeout(()=>S.cadDel=0,4000);return toast('Toque em Descartar de novo para apagar o rascunho')}
  S.cadDel=0;S.cad={m:S.cad.m,d:iso(T()),cont:{},f:'',obs:''};cadSave();render();toast('Rascunho descartado')}
async function cadSalvar(){const C=cadLoad(),t=cadTot();if(!t.q)return toast('Nenhuma questão marcada');if(!C.d)return toast('Informe a data');
  const l=cadMarcados().map(i=>({i,c:C.cont[keyOf(i.m,i.a,i.s)]}));
  let n=S.ses.filter(s=>s.d===C.d).length, base=Date.now();const novos=l.map((x,j)=>({_id:'s'+(base+j).toString(36),d:C.d,m:x.i.m,a:x.i.a,s:x.i.s,q:x.c.q,ac:x.c.ac,tipo:'Questões',motivo:'',obs:C.obs?('Caderno · '+C.obs):'Caderno',n:++n}));
  S.ses.push(...novos);recalc();
  try{for(const s of novos){const {_id,...d}=s;await S.db.collection('sessoes').doc(_id).set(clean(d))}}catch(e){toast('Falha ao salvar algumas sessões');return render()}
  /* ciclo: compara com o próximo bloco começando pela matéria do caderno com mais questões */
  const pm={};for(const x of l){const o=pm[x.i.m]||(pm[x.i.m]={q:0,ac:0,l:[]});o.q+=x.c.q;o.ac+=x.c.ac;o.l.push(x)}
  const mats=Object.keys(pm);let cq=null;
  S.cad={m:C.m,d:iso(T()),cont:{},f:'',obs:''};cadSave();
  const msg=novos.length+(novos.length===1?' sessão salva':' sessões salvas')+(mats.length>1?' em '+mats.length+' matérias':'');
  toast(msg);if(cq){S.cq=cq;go('cic')}else go('hoje')}
function renderPv(){
  const e=$('#pv'); if(!e)return; const R=S.reg; const q=+($('#rq')||{}).value||0, ac=+($('#rac')||{}).value||0, d=($('#rd')||{}).value;
  if(!R.s||!q||!d){e.innerHTML='<span class="sub">Preencha subassunto e questões para ver a prévia.</span>';return}
  if(ac>q){e.innerHTML='<span style="color:var(--alta)">Acertos maior que questões.</span>';return}
  const k=keyOf(R.m,R.a,R.s), list=S.ses.filter(s=>keyOf(s.m,s.a,s.s)===k).concat([{d,q,ac,n:999}]).sort((a,b)=>dn(a.d)-dn(b.d)||(a.n||0)-(b.n||0));
  const itR=S.items.find(i=>keyOf(i.m,i.a,i.s)===k), X0=itR?+itR.q0||0:0, L=ladder(list,S.cfg,itR&&itR.peso,itR?{q:X0>0?X0:(itR.p0!=null?S.cfg.minAmostra:0),p:X0>0?(+itR.a0||0)/X0:(itR.p0==null?null:+itR.p0),v0:itR.v0}:null), me=L.find(x=>x.n===999&&x.d===d)||L[L.length-1];
  const p=ac/q, lbl=q<(S.cfg.minLadder||S.cfg.minAmostra)?'amostra pequena (mantém o degrau e soma com as próximas sessões)':p>=S.cfg.minSubir?'boa — sobe um degrau':p<S.cfg.pctZera?'fraca — volta ao início':'fraca — desce dois degraus';
  e.innerHTML=`<div class="big">${pc(p)}</div><div class="sub">${lbl}</div><div style="margin-top:6px">Próxima revisão: <b>${fd(me.next)}</b> (em ${me.interval} dias)</div>`;
}
async function saveReg(){
  const R=S.reg,q=+$('#rq').value||0,ac=+$('#rac').value||0,d=$('#rd').value;
  if(!R.m||!R.a||!R.s||!q||!d)return toast('Preencha matéria, assunto, subassunto e questões');
  if(ac>q||ac<0)return toast('Acertos inválidos');
  const n=S.ses.filter(s=>s.d===d).length+1;
  await addSes({d,m:R.m,a:R.a,s:R.s,q,ac,tipo:$('#rt').value,motivo:'',obs:$('#ro').value,n});
  const cq=null;
  S.reg={};regSave();
  if(cq){S.cq=cq;go('cic')} else {toast('Sessão salva'+proxTxt(R.m,R.a,R.s));go('hoje')}
}

  const l=(S.hrs||[]).slice().sort((a,b)=>dn(b.d)-dn(a.d)||(b.t||0)-(a.t||0)).slice(0,15);

function hPre(a,b){const F=hForm();F.h=a?String(a):'';F.min=b?String(b):'';render()}

async function redSave(){const tx=String($('#rd-n').value).trim(),n=tx===''?null:parseFloat(tx.replace(',','.'));if(n!=null&&(isNaN(n)||n<0||n>10))return toast('Informe a nota de 0 a 10');const d=$('#rd-d').value;if(!d)return toast('Informe a data');
  const doc={d,tema:$('#rd-t').value.trim()||'Redação',t:Date.now()};if(n!=null)doc.nota=Math.round(n*10)/10;const id='r'+Date.now().toString(36);
  S.rd=false;S.red=(S.red||[]).concat([{...doc,_id:id}]);render();try{await S.db.collection('redacao').doc(id).set(doc);toast('Redação registrada')}catch(e){toast('Não foi possível salvar')}}
async function redDel(id){S.red=(S.red||[]).filter(x=>x._id!==id);render();try{await S.db.collection('redacao').doc(id).delete()}catch(e){toast('Não foi possível excluir')}}

/* ===== SIMULADOS INÉDITOS (aba Simulados) =====
   simulados/{id}: questões, textos, estudo de caso (escritos pelo Claude)
   sim_tent/{id}: uma tentativa: respostas, tempo, resultado, nota da discursiva */
const SL='ABCDE';
/* simulados publicados como arquivos do próprio app (simulados/index.json) + eventuais do banco */
function simMerge(){const m=new Map();for(const x of (S.simsFile||[]))m.set(x.id,x);for(const x of (S.simsDb||[]))m.set(x.id,x);return [...m.values()]}
async function simLoadFiles(){try{const r=await fetch('simulados/index.json',{cache:'no-store'});if(!r.ok)return;const ix=await r.json();const out=[];
  for(const f of ix.arquivos||[]){try{const q=await fetch('simulados/'+f,{cache:'no-store'});if(q.ok)out.push(await q.json())}catch(e){}}
  S.simsFile=out;S.sims=simMerge();bgRender()}catch(e){}}
function simById(id){return S.sims.find(x=>x.id===id)}
function simTents(sid){return S.tents.filter(t=>t.sim===sid).sort((a,b)=>a.ini-b.ini)}
function simFmtT(sec){sec=Math.max(0,Math.round(sec));const h=Math.floor(sec/3600),m=Math.floor(sec%3600/60),s=sec%60;return h+':'+String(m).padStart(2,'0')+':'+String(s).padStart(2,'0')}
function simLinkItem(l){if(!l)return null;let x=null;if(l.id)x=S.items.find(i=>i.id===l.id);if(!x&&l.cid)x=S.items.find(i=>i.cic===l.cid);
  if(!x)x=S.items.find(i=>i.m===l.m&&i.a===l.a&&i.s===l.s);if(!x&&l.m){const m2=null}return x}
function simLinkName(l){const x=simLinkItem(l);const o=x||l;return o.a+(o.s&&o.s!=='Todo o conteúdo do assunto'?' · '+o.s:'')}
/* resultado de uma tentativa */
function simCalc(sim,t){const r={G:[0,0],E:[0,0],mat:{},tot:0,ac:0,br:0};
  for(const q of sim.questoes){const a=t.resp&&t.resp[q.n];const ok=a===q.gab;r[q.area][1]++;if(ok)r[q.area][0]++;if(!a)r.br++;
    const m=r.mat[q.mat]||(r.mat[q.mat]={q:0,ac:0,area:q.area});m.q++;if(ok)m.ac++;r.tot++;if(ok)r.ac++}
  r.nG=r.G[1]?r.G[0]/r.G[1]*10:0;r.nE=r.E[1]?r.E[0]/r.E[1]*10:0;r.nota=r.tot?r.ac/r.tot*10:0;return r}
function nf(x,d=2){return x.toFixed(d).replace('.',',')}
/* ---------- lista ---------- */
function vSim(){
  if(S.simRun){const t=S.tents.find(x=>x._id===S.simRun.tid),sim=t&&simById(t.sim);if(t&&sim)return t.fim?vSimRes(sim,t):vSimRun(sim,t);S.simRun=null}
  let h=`<h1>Simulados</h1><div class="sub">Inéditos no estilo FUMARC (referência provisória), proporcionais ao edital do TRT3. O resultado entra nas suas sessões, por assunto.</div>`;
  if(!S.sims.length) return h+`<div class="msg">Nenhum simulado disponível ainda. Peça no chat para gerar o simulado nº 1 (60 questões no padrão de 2022: 15 Português, 5 Informática, 5 Legislação, 5 Direito e 30 específicas).</div>`;
  for(const sim of S.sims.slice().sort((a,b)=>a.n-b.n)){
    const ts=simTents(sim.id),fin=ts.filter(t=>t.fim),and=ts.find(t=>!t.fim),last=fin[fin.length-1];
    const nG=sim.questoes.filter(q=>q.area==='G').length;
    let st='<span class="badge b-neu">não iniciado</span>',res='';
    if(and){const nr=Object.keys(and.resp||{}).length;st=`<span class="badge b-media">em andamento · ${nr}/${sim.questoes.length}</span>`}
    else if(last){const r=simCalc(sim,last);st=`<span class="badge ${r.nota>=6?'b-ok':'b-alta'}">nota ${nf(r.nota)}</span>`;
      res=`<div class="meta"><span>Acertos <b>${r.ac}/${r.tot}</b></span><span>Gerais <b>${r.G[0]}/${r.G[1]}</b></span><span>Específicos <b>${r.E[0]}/${r.E[1]}</b></span>${last.discNota!=null?`<span>Redação <b>${nf(last.discNota,1)}</b></span>`:''}</div>`}
    h+=`<div class="card"><div class="row sp"><div class="tag">Simulado nº ${sim.n} · ${esc(sim.criado?fdi(sim.criado):'')}</div>${st}</div>
     <div class="ttl">${esc(sim.titulo)}</div><div class="sub">${sim.questoes.length} objetivas (${nG} gerais + ${sim.questoes.length-nG} específicas)${sim.disc?' + 1 redação':''} · ${nf((sim.duracao_min||270)/60,1)}h</div>${res}
     <div class="row" style="margin-top:10px;flex-wrap:wrap">${and?`<button class="btn p s" onclick="simOpen('${and._id}')">Continuar</button>`:`<button class="btn p s" onclick="simStart('${sim.id}')">${fin.length?'Refazer':'Começar'}</button>`}${last?`<button class="btn s" onclick="simOpen('${last._id}')">Ver correção</button>`:''}</div></div>`}
  h+=`<div class="sub" style="margin-top:10px">Como funciona: faça as objetivas com o cronômetro correndo e escreva a redação no papel. Ao entregar, o app corrige, mostra os comentários e registra cada assunto nas suas sessões. Depois, você mesmo dá a nota da redação usando o espelho.</div>`;
  return h}
async function simStart(sid){const id='t'+Date.now().toString(36);const t={sim:sid,ini:Date.now(),gasto:0,resp:{},marc:{},atual:1};
  S.tents.push({...t,_id:id});S.simRun={tid:id,t0:Date.now()};render();try{await S.db.collection('sim_tent').doc(id).set(t)}catch(e){toast('Não foi possível iniciar: tente de novo')}}
function simOpen(tid){S.simRun={tid,t0:Date.now(),filtro:'todas'};render();scrollTo(0,0)}
function simExit(){simFlush();S.simRun=null;render()}
/* ---------- fazendo a prova ---------- */
function vSimRun(sim,t){const n=t.atual||1,q=sim.questoes.find(x=>x.n===n),tot=sim.questoes.length;
  const nr=Object.keys(t.resp||{}).length,el=(t.gasto||0)+(Date.now()-S.simRun.t0)/1000,lim=(sim.duracao_min||270)*60;
  let h=`<div class="sim-bar"><div class="row sp"><div><b>${esc(sim.titulo)}</b><div class="sub">${nr} de ${tot} respondidas</div></div>
   <div style="text-align:right"><div id="sim-timer" class="sim-timer">${simFmtT(el)}</div><div class="sub">de ${simFmtT(lim)}</div></div></div>
   <div class="bar" style="margin-top:6px"><i style="width:${nr/tot*100}%;background:var(--acc)"></i></div></div>`;
  if(n==='disc'){h+=simDiscHtml(sim,t,false)}
  else{const tx=q.texto&&sim.textos?sim.textos.find(x=>x.id===q.texto):null;
   h+=`<div class="card"><div class="row sp"><div class="tag">Questão ${q.n} · ${q.area==='G'?'Conhecimentos Básicos':'Conhecimentos Específicos'} · ${esc(q.mat)}</div><button class="btn s ${t.marc&&t.marc[q.n]?'p':''}" onclick="simMarc(${q.n})">${t.marc&&t.marc[q.n]?'Marcada':'Marcar'}</button></div>
    ${tx?`<details class="sim-tx" ${S.simTx?'open':''} ontoggle="S.simTx=this.open"><summary>Texto: ${esc(tx.titulo)}</summary><div class="sim-corpo">${esc(tx.corpo)}</div></details>`:''}
    <div class="sim-enun">${esc(q.enun)}</div>
    <div class="sim-alts">${q.alts.map((a,i)=>`<button class="sim-alt ${t.resp[q.n]===SL[i]?'on':''}" onclick="simResp(${q.n},'${SL[i]}')"><span class="sim-l">${SL[i]}</span><span>${esc(a)}</span></button>`).join('')}</div></div>`}
  h+=`<div class="row" style="gap:8px;margin:10px 0"><button class="btn grow" onclick="simGo(-1)" ${n===1?'disabled':''}>← Anterior</button><button class="btn grow" onclick="simGo(1)">${n==='disc'?'Fim':n===tot?(sim.disc?'Redação →':'Fim'):'Próxima →'}</button></div>`;
  h+=`<div class="sim-grid">`+sim.questoes.map(x=>`<button class="sim-n ${t.resp[x.n]?'ok':''} ${t.marc&&t.marc[x.n]?'mk':''} ${x.n===n?'cur':''}" onclick="simGoTo(${x.n})">${x.n}</button>`).join('')+(sim.disc?`<button class="sim-n ${n==='disc'?'cur':''}" style="grid-column:span 2" onclick="simGoTo('disc')">Redação</button>`:'')+`</div>
   <div class="sub" style="margin-top:6px">Azul: respondida · borda laranja: marcada para revisar</div>
   <div class="row" style="margin-top:14px;flex-wrap:wrap;gap:8px"><button class="btn p grow" onclick="simEntregar()">${S.simArm?'Toque de novo para entregar':'Entregar e corrigir'}</button><button class="btn" onclick="simExit()">Pausar e sair</button></div>
   ${tot-nr?`<div class="sub" style="margin-top:6px">${tot-nr} questões em branco. Confira no edital novo se haverá desconto por erro; sem desconto, vale chutar.</div>`:''}`;
  return h}
function simCur(){const t=S.tents.find(x=>x._id===S.simRun.tid);return [t,simById(t.sim)]}
function simResp(n,l){const [t]=simCur();t.resp={...t.resp};if(t.resp[n]===l)delete t.resp[n];else t.resp[n]=l;S.simArm=false;render();simSave()}
function simMarc(n){const [t]=simCur();t.marc={...(t.marc||{})};if(t.marc[n])delete t.marc[n];else t.marc[n]=1;render();simSave()}
function simGoTo(n){const [t]=simCur();t.atual=n;S.simArm=false;render();scrollTo(0,0);simSave()}
function simGo(d){const [t,sim]=simCur();const tot=sim.questoes.length;let n=t.atual||1;
  if(n==='disc'){if(d<0)n=tot;else return}else{n+=d;if(n>tot)n=sim.disc?'disc':tot;if(n<1)n=1}simGoTo(n)}
let simSaveT=null;
function simSave(){clearTimeout(simSaveT);simSaveT=setTimeout(simFlush,700)}
async function simFlush(){clearTimeout(simSaveT);if(!S.simRun)return;const t=S.tents.find(x=>x._id===S.simRun.tid);if(!t||t.fim)return;
  const now=Date.now();t.gasto=(t.gasto||0)+(now-S.simRun.t0)/1000;S.simRun.t0=now;const {_id,...d}=t;
  try{await S.db.collection('sim_tent').doc(_id).set(clean(d))}catch(e){toast('Não foi possível salvar a resposta')}}
setInterval(()=>{const e=document.getElementById('sim-timer');if(!e||!S.simRun)return;const t=S.tents.find(x=>x._id===S.simRun.tid);if(!t||t.fim)return;
  const el=(t.gasto||0)+(Date.now()-S.simRun.t0)/1000;e.textContent=simFmtT(el);const sim=simById(t.sim);if(sim&&el>(sim.duracao_min||270)*60)e.style.color='var(--alta)'},1000);
async function simEntregar(){if(!S.simArm){S.simArm=true;render();return}S.simArm=false;
  const [t,sim]=simCur();const now=Date.now();t.gasto=(t.gasto||0)+(now-S.simRun.t0)/1000;S.simRun.t0=now;t.fim=now;
  const r=simCalc(sim,t);t.res={ac:r.ac,tot:r.tot,G:r.G,E:r.E,nota:Math.round(r.nota*100)/100};
  /* registra por assunto nas sessões do app */
  const today=iso(T()),grp=new Map();
  for(const q of sim.questoes){const k=JSON.stringify(q.link);const g=grp.get(k)||{link:q.link,q:0,ac:0};g.q++;if(t.resp[q.n]===q.gab)g.ac++;grp.set(k,g)}
  let nSes=0,nCad=0;const cads=[];
  for(const g of grp.values()){let x=simLinkItem(g.link);
    if(!x){x={id:'n'+Date.now().toString(36)+(nCad++),m:g.link.m,a:g.link.a,s:g.link.s,peso:3,d0:today};if(g.link.cid)x.cic=g.link.cid;S.items.push(x);cads.push(x)}
    g.item=x}
  t.reg=true;const {_id,...d}=t;
  try{if(cads.length){recalc();await saveItems()}
    await S.db.collection('sim_tent').doc(_id).set(clean(d));
    let n0=S.ses.filter(s=>s.d===today).length;
    for(const g of grp.values()){await addSes({d:today,m:g.item.m,a:g.item.a,s:g.item.s,q:g.q,ac:g.ac,tipo:'Simulado',motivo:'',obs:sim.titulo,n:++n0});nSes++}
    toast(nSes+' assuntos registrados nas suas sessões'+(cads.length?' ('+cads.length+' cadastrados)':''))}catch(e){toast('A correção foi salva, mas houve falha ao registrar as sessões')}
  S.simRun.filtro='erradas';
  render();scrollTo(0,0)}
/* ---------- correção ---------- */
function vSimRes(sim,t){const r=simCalc(sim,t),f=S.simRun.filtro||'todas';
  const col=x=>x>=6?'var(--ok)':'var(--alta)';
  let h=`<div class="row sp"><h1 style="font-size:22px">${esc(sim.titulo)}</h1><button class="btn s" onclick="simExit()">Voltar</button></div>
   <div class="sub">Entregue em ${new Date(t.fim).toLocaleDateString('pt-BR')} · tempo ${simFmtT(t.gasto||0)}</div>
   <div class="tiles t3" style="margin-top:12px"><div class="tile"><div class="l">Nota objetiva</div><div class="n" style="color:${col(r.nota)}">${nf(r.nota)}</div></div>
   <div class="tile"><div class="l">Conhecimentos básicos</div><div class="n">${r.G[0]}/${r.G[1]}</div><div class="sub">${nf(r.nG)}</div></div>
   <div class="tile"><div class="l">Específicos</div><div class="n">${r.E[0]}/${r.E[1]}</div><div class="sub">${nf(r.nE)}</div></div></div>
   <div class="sub" style="margin-top:6px">Nota provisória = acertos ÷ total × 10. A regra de pontuação e o mínimo de aprovação só valem quando o edital novo sair; use 60% como referência de trabalho.</div>`;
  if(t.reg) h+=`<div class="msg" style="margin-top:10px">O resultado já foi registrado por assunto nas suas sessões (aba Registrar → Histórico). Os assuntos com erro entram na revisão do app. Registre os erros recorrentes no caderno de erros e no Anki.</div>`;
  h+=`<h2>Por matéria</h2><div class="card"><table><tr><th>Matéria</th><th>Acertos</th><th>%</th></tr>`+Object.entries(r.mat).sort((a,b)=>(a[1].area<b[1].area?-1:a[1].area>b[1].area?1:0)||(a[1].ac/a[1].q-b[1].ac/b[1].q)).map(([m,x])=>`<tr><td>${esc(m)}<div class="sub">${x.area==='G'?'Gerais':'Específicos'}</div></td><td>${x.ac}/${x.q}</td><td style="font-weight:600;color:${x.ac/x.q>=.7?'var(--ok)':x.ac/x.q>=.5?'var(--media)':'var(--alta)'}">${pc(x.ac/x.q,0)}</td></tr>`).join('')+`</table></div>`;
  if(sim.disc) h+=simDiscHtml(sim,t,true);
  h+=`<h2>Questões comentadas</h2><div class="row" style="gap:6px;margin-bottom:8px;flex-wrap:wrap">${[['erradas','Erradas e em branco'],['todas','Todas'],['marcadas','Marcadas']].map(([k,l])=>`<button class="btn s ${f===k?'p':''}" onclick="S.simRun.filtro='${k}';render()">${l}</button>`).join('')}</div>`;
  const qs=sim.questoes.filter(q=>f==='todas'||(f==='erradas'&&t.resp[q.n]!==q.gab)||(f==='marcadas'&&t.marc&&t.marc[q.n]));
  if(!qs.length) h+=`<div class="empty">${f==='erradas'?'Nenhum erro. Gabaritou!':'Nada aqui.'}</div>`;
  for(const q of qs){const a=t.resp[q.n],ok=a===q.gab;
    h+=`<div class="card"><div class="row sp"><div class="tag">Questão ${q.n} · ${esc(q.mat)}</div><span class="badge ${ok?'b-ok':a?'b-alta':'b-neu'}">${ok?'acertou':a?'errou':'em branco'}</span></div>
     <div class="sim-enun">${esc(q.enun)}</div><div class="sim-alts">${q.alts.map((x,i)=>{const L=SL[i];const c=L===q.gab?'gab':L===a?'err':'';return `<div class="sim-alt ro ${c}"><span class="sim-l">${L}</span><span>${esc(x)}</span></div>`}).join('')}</div>
     <div class="sim-com"><b>Gabarito ${q.gab}.</b> ${esc(q.com)}</div>
     <div class="sub" style="margin-top:6px">Assunto no app: ${esc(simLinkName(q.link))}${q.conferir?' · <span class="badge b-media">confira no texto oficial</span>':''}</div></div>`}
  return h}
function simDiscHtml(sim,t,corr){const d=sim.disc,LN=d.linhas||30;
  let h=`<h2>Redação</h2><div class="card"><div class="ttl">${esc(d.titulo)}</div><div class="sim-enun">${esc(d.enun)}</div>
   <div class="sub" style="margin-top:8px">Escreva o texto no papel (até ${LN} linhas, ou o limite do edital novo). O espelho de correção e o texto-modelo aparecem depois da entrega.</div>
   ${d.dicas?`<details style="margin-top:8px"><summary class="sub" style="cursor:pointer"><b>Como a banca espera o texto</b></summary><ul class="sub" style="margin:6px 0 0 18px;padding:0">${d.dicas.map(x=>`<li style="margin:3px 0">${esc(x)}</li>`).join('')}</ul></details>`:''}</div>`;
  if(!corr) return h;
  if(!d.grade){
    h+=`<div class="card"><div class="tag">Espelho de correção</div>`+d.espelho.map(x=>`<div class="sim-com" style="margin-top:8px">${esc(x)}</div>`).join('')+`<div class="sub" style="margin-top:8px">${esc(d.criterios)}</div>
     <label for="sim-dn">Sua nota na redação (0 a 10)</label><div class="row" style="gap:8px"><input id="sim-dn" type="text" inputmode="decimal" placeholder="ex.: 7,5" value="${t.discNota!=null?String(t.discNota).replace('.',','):''}"><button class="btn p" onclick="simDiscSave()">Salvar nota</button></div>
     <div class="sub" style="margin-top:6px">A nota também entra no histórico de redações do Plano.</div></div>`;
    return h}
  const G=simGradeState(t),ck=id=>G.c.includes(id)?'checked':'',f=x=>nf(x,1);
  const item=(id,x,neg)=>`<label style="display:flex;gap:10px;align-items:flex-start;margin:8px 0;font-weight:400;color:var(--ink);font-size:14px;line-height:1.4;cursor:pointer"><input type="checkbox" data-g="${id}" data-p="${x.p}" ${ck(id)} onchange="simGradeCalc()" style="width:20px;height:20px;margin:1px 0 0;flex-shrink:0"><span>${esc(x.t)} <b style="color:${neg?'var(--alta)':'var(--mut)'};white-space:nowrap">${neg?'−':''}${f(Math.abs(x.p))}</b></span></label>`;
  h+=`<div class="card" id="sim-grade"><div class="tag">Grade de correção</div><div class="sub" style="margin-top:4px">Releia o seu texto e marque cada elemento que você realmente escreveu e fundamentou. A nota é calculada sozinha.</div>`;
  d.grade.forEach((g,gi)=>{h+=`<div style="margin-top:12px"><b>${esc(g.q)}</b> <span class="sub">(${f(g.itens.reduce((a,x)=>a+x.p,0))})</span>${g.itens.map((x,ii)=>item(gi+'.'+ii,x)).join('')}</div>`});
  h+=`<div style="margin-top:12px"><b>Estrutura e expressão</b> <span class="sub">(${f((d.expr||[]).reduce((a,x)=>a+(x.niveis?Math.max(...x.niveis.map(n=>n[1])):x.p),0))})</span>`+(d.expr||[]).map((x,k)=>x.niveis
     ?`<div style="margin:8px 0"><div style="font-size:14px;margin-bottom:4px">${esc(x.t)}</div><select data-n="e${k}" onchange="simGradeCalc()">${x.niveis.map((n,ni)=>`<option value="${n[1]}" ${String(G.n['e'+k])===String(n[1])?'selected':''}>${esc(n[0])} (${f(n[1])})</option>`).join('')}</select></div>`
     :item('e'+k,x)).join('')+`</div>`;
  if(d.desc&&d.desc.length)h+=`<div style="margin-top:12px"><b>Descontos</b>${d.desc.map((x,k)=>item('d'+k,x,true)).join('')}</div>`;
  h+=`<div class="sub" id="sim-gt" style="margin-top:12px;font-size:15px"></div>
   <details style="margin-top:12px"><summary style="cursor:pointer;font-weight:600">Ver resposta-modelo</summary><div class="sim-com" style="margin-top:8px;white-space:normal">${esc(d.modelo||'').split(/\n\s*\n/).map(p=>`<p style="margin:0 0 10px;text-indent:1.5em">${p}</p>`).join('')}</div></details>
   <div class="sub" style="margin-top:10px">${esc(d.criterios||'')}</div>
   <label for="sim-dn">Sua nota na redação (0 a 10)</label><div class="row" style="gap:8px"><input id="sim-dn" type="text" inputmode="decimal" placeholder="calculada pela grade" value="${t.discNota!=null?String(t.discNota).replace('.',','):''}"><button class="btn p" onclick="simDiscSave()">Salvar nota</button></div>
   <div class="sub" style="margin-top:6px">Dá para ajustar a nota à mão antes de salvar. Ela também entra no histórico de redações do Plano.</div></div>`;
  setTimeout(()=>simGradeCalc(true),0);
  return h}
/* estado da grade: o que foi marcado fica guardado na tentativa (e em memória até salvar) */
function simGradeState(t){S.discG=S.discG||{};const k=t._id||'x';if(!S.discG[k])S.discG[k]=t.discGrade?JSON.parse(JSON.stringify(t.discGrade)):{c:[],n:{}};const g=S.discG[k];g.c=g.c||[];g.n=g.n||{};return g}
function simGradeCalc(inicial){const box=$('#sim-grade');if(!box)return;const [t,sim]=simCur();if(!t||!sim||!sim.disc.grade)return;const G=simGradeState(t);
  let cont=0,ex=0,de=0;G.c=[];
  box.querySelectorAll('input[data-g]').forEach(e=>{if(!e.checked)return;G.c.push(e.dataset.g);const p=+e.dataset.p,id=e.dataset.g;if(id[0]==='d')de+=p;else if(id[0]==='e')ex+=p;else cont+=p});
  box.querySelectorAll('select[data-n]').forEach(e=>{G.n[e.dataset.n]=+e.value;ex+=+e.value});
  const nota=Math.max(0,Math.min(10,Math.round((cont+ex+de)*10)/10));
  const gt=$('#sim-gt');if(gt)gt.innerHTML=`Conteúdo <b>${nf(cont,1)}</b>/8 · Estrutura e expressão <b>${nf(ex,1)}</b>/2${de?` · Descontos <b style="color:var(--alta)">${nf(de,1)}</b>`:''} · <b style="font-size:17px;color:${nota>=6?'var(--ok)':'var(--alta)'}">Nota ${nf(nota,1)}</b> ${nota>=6?'(habilitaria)':'(abaixo do mínimo de 6,0)'}`;
  const dn=$('#sim-dn');if(dn&&(!inicial||t.discNota==null))dn.value=(G.c.length||Object.keys(G.n).length)?String(nota).replace('.',','):'';}
async function simDiscSave(){const [t,sim]=simCur();const n=parseFloat(String($('#sim-dn').value).replace(',','.'));if(isNaN(n)||n<0||n>10)return toast('Informe a nota de 0 a 10');
  t.discNota=Math.round(n*10)/10;if(sim.disc.grade){const G=simGradeState(t);t.discGrade={c:G.c.slice(),n:{...G.n}}}const {_id,...d}=t;
  try{await S.db.collection('sim_tent').doc(_id).set(clean(d));
    {const ex=(S.red||[]).find(x=>x.simTent===_id);const doc={d:iso(T()),tema:'Redação do '+sim.titulo,nota:t.discNota,simTent:_id,t:Date.now()};const id=ex?ex._id:'r'+Date.now().toString(36);await S.db.collection('redacao').doc(id).set(doc)}
    toast('Nota da redação salva')}catch(e){toast('Não foi possível salvar a nota')}render()}

render();init();
</script>
<script>if("serviceWorker"in navigator&&location.protocol.startsWith("http"))navigator.serviceWorker.register("sw.js").catch(()=>{})</script>
